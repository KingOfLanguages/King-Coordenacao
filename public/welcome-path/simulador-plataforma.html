<!doctype html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Simulador da plataforma</title>
<!-- ─────────────────────────────────────────────────────────────────────────
     Simulador da plataforma do professor — etapa 7 (Encerramento) do Welcome
     Path, embutido pelo bloco `embed` (ver src/pages/welcomePath/Blocos.tsx).

     Uma cópia de TREINO da plataforma do professor da King (mesmo menu e as
     mesmas rotas de app.kingmanagementsystem.com.br) e do WhatsApp, com oito
     missões que atravessam outubro de 2026. Nada sai daqui: não há rede, não
     há gravação. O gabarito fica neste arquivo de propósito — isto é treino;
     a nota que conta é a da prova final da etapa, corrigida no servidor.

     As regras vêm do MAPA (Critérios de reposição, Lançamento de aulas,
     Reposições, Financeiro, Notas fiscais) e da própria trilha. Os tipos de
     lançamento e os rótulos espelham a API real (typeClass de
     /api/class-launch): "Presença", "Falta", "Falta com Direito a Reposição -
     Falta do Aluno", "Falta com Direito a Reposição - Falta do Professor",
     "Presença na Reposição". O limite de 4 reposições/mês é o de
     /api/class-launch/replacement-limit.

     Mesma conversa com o pai que a calculadora da etapa 6, mais uma:
       recebe  { tipo:"ktm-tema", tema:"light"|"dark" }
       envia   { tipo:"ktm-embed-altura", altura:<px> }
       envia   { tipo:"ktm-embed-rolar" }   → o pai rola até o topo do iframe
     A origem aqui é opaca (sandbox sem allow-same-origin): o pai valida por
     event.source. Sem allow-modals, então nada de alert/confirm.

     Sem localStorage (o sandbox bloqueia): recarregar recomeça o simulador.
     ───────────────────────────────────────────────────────────────────── -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap">
<style>
/* color-scheme igual ao do portal: o next-themes põe color-scheme:dark no
   <html> do KTM no tema escuro, e quando o iframe tem esquema diferente do
   da página o navegador pinta um fundo BRANCO opaco atrás dele. */
:root{
  color-scheme:light;
  --bg-canvas:#ffffff; --bg-subtle:#f3f4f7; --bg-muted:#e8eaef;
  --fg-primary:#131316; --fg-secondary:#474850; --fg-muted:#71727e; --fg-subtle:#a9abb5;
  --border-soft:#e6e8ee; --border-default:#d9dce4; --border-strong:#c3c7d1;
  --accent:#2a5cff; --accent-hov:#1d47d6; --accent-on:#ffffff;
  --info-bg:#e3ebff; --info-fg:#1c3f9e; --info-bd:#bfd0ff;
  --ok-bg:#d9f1e3;   --ok-fg:#0e6430;   --ok-bd:#a5d8bd;
  --hold-bg:#fce6c9; --hold-fg:#894800; --hold-bd:#eec79b;
  --err-bg:#fde4e2;  --err-fg:#a1231b;  --err-bd:#f4bcb7;
  --kms-head:#0b1739;
  --wa-bg:#efeae2; --wa-in:#ffffff; --wa-out:#d9fdd3; --wa-head:#f0f2f5;
  --wa-text:#111b21; --wa-meta:#667781; --wa-green:#00a884; --wa-name:#0b7a5b;
  --shadow-card:0 1px 3px 0 rgba(0,0,0,.05);
  --shadow-win:0 10px 30px -14px rgba(15,23,42,.32);
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg-canvas:#0e1016; --bg-subtle:#161a24; --bg-muted:#1f2432;
  --fg-primary:#edeef2; --fg-secondary:#bbbdc8; --fg-muted:#8b8e9a; --fg-subtle:#5d606d;
  --border-soft:#1c2130; --border-default:#262d40; --border-strong:#343c52;
  --accent:#4f7bff; --accent-hov:#6a8fff;
  --info-bg:#121f3f; --info-fg:#a8c1ff; --info-bd:#26386d;
  --ok-bg:#0f2a1d;   --ok-fg:#6ed69a;   --ok-bd:#1e4a34;
  --hold-bg:#2e1f08; --hold-fg:#f0c274; --hold-bd:#553c12;
  --err-bg:#341311;  --err-fg:#ff9d95;  --err-bd:#5c211c;
  --kms-head:#08112b;
  --wa-bg:#0b141a; --wa-in:#202c33; --wa-out:#005c4b; --wa-head:#1b252c;
  --wa-text:#e9edef; --wa-meta:#8696a0; --wa-name:#35c89c;
  --shadow-card:0 1px 3px 0 rgba(0,0,0,.4);
  --shadow-win:0 10px 30px -14px rgba(0,0,0,.7);
}
*{box-sizing:border-box}
html{background:transparent}
body{
  margin:0; background:transparent; color:var(--fg-primary);
  font-family:Geist,system-ui,-apple-system,"Segoe UI",sans-serif;
  font-feature-settings:"rlig","calt","cv11","ss01";
  -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
  font-size:14px; line-height:1.5;
}
.wrap{padding:2px 2px 12px}
h1,h2,h3{margin:0; letter-spacing:-0.02em; text-wrap:balance}
p{margin:0}
button{font-family:inherit; font-size:inherit; color:inherit}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.num{font-family:"Geist Mono",ui-monospace,monospace; font-variant-numeric:tabular-nums}
.eyebrow{font-size:10.5px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--fg-muted)}
.ic{flex:none; vertical-align:-2px}
.pg-sub{font-size:12.5px; color:var(--fg-muted)}
.help{font-size:12px; color:var(--fg-muted); margin-top:5px; line-height:1.5}
.txt-err{color:var(--err-fg)} .txt-hold{color:var(--hold-fg)}

/* ── botões ── */
.btn{display:inline-flex; align-items:center; justify-content:center; gap:6px; border-radius:8px; padding:8px 14px; font:600 13px Geist,sans-serif; border:1px solid var(--border-default); background:var(--bg-canvas); color:var(--fg-primary); cursor:pointer; transition:background .15s,border-color .15s,color .15s; white-space:nowrap}
.btn:hover{border-color:var(--border-strong)}
.btn-pri{background:var(--accent); border-color:var(--accent); color:var(--accent-on)}
.btn-pri:hover{background:var(--accent-hov); border-color:var(--accent-hov)}
.btn-sm{padding:5px 10px; font-size:12px; border-radius:7px}
.btn-wa{background:var(--wa-green); border-color:var(--wa-green); color:#fff}
.btn:disabled,.btn.dis{opacity:.5; cursor:not-allowed}
.btn-link{background:none; border:0; padding:0; color:var(--accent); font:500 12px Geist,sans-serif; cursor:pointer; text-decoration:underline; text-underline-offset:2px}

/* ── intro e relatório ── */
.intro,.rel{background:var(--bg-canvas); border:1px solid var(--border-soft); border-radius:16px; box-shadow:var(--shadow-card); padding:22px 22px 20px}
.intro h1,.rel h1{font-size:24px; line-height:1.15; margin:6px 0 8px}
.intro .sub,.rel .sub{color:var(--fg-secondary); max-width:70ch; line-height:1.6}
.passos{list-style:none; padding:0; margin:16px 0 0; display:grid; gap:9px}
.passos li{display:flex; gap:10px; font-size:13.5px; color:var(--fg-secondary); line-height:1.55}
.passos li .n{width:22px; height:22px; flex:none; border-radius:50%; background:var(--info-bg); color:var(--info-fg); display:grid; place-items:center; font:600 11.5px Geist,sans-serif; margin-top:1px}
.passos li b{color:var(--fg-primary)}
.missoes-prev{display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:6px; margin:18px 0 18px}
.missoes-prev div{font-size:12.5px; padding:8px 10px; border:1px solid var(--border-soft); border-radius:9px; background:var(--bg-subtle); color:var(--fg-secondary)}
.missoes-prev b{font:600 11px "Geist Mono",monospace; color:var(--accent); margin-right:6px}
.novo{display:flex; gap:10px; align-items:flex-start; padding:11px 13px; border-radius:10px; background:var(--hold-bg); color:var(--hold-fg); border:1px solid var(--hold-bd); font-size:13px; margin-top:16px; line-height:1.55}
.cta{display:flex; gap:10px; align-items:flex-start; margin-top:18px; padding:13px 15px; border-radius:12px; background:var(--info-bg); color:var(--info-fg); border:1px solid var(--info-bd); font-size:13.5px; line-height:1.55}
.revisar{margin-top:18px}
.revisar h2{font-size:15.5px; margin-bottom:8px}
.revisar li{margin-bottom:8px; font-size:13px; color:var(--fg-secondary); line-height:1.55}
.revisar li b{color:var(--fg-primary)}
.stars{display:inline-flex; gap:2px; color:var(--hold-fg)}
.stars .off{color:var(--border-strong)}

/* ── painel da missão ── */
.mis{background:var(--bg-canvas); border:1px solid var(--border-soft); border-radius:14px; box-shadow:var(--shadow-card); padding:16px 18px; margin-bottom:14px}
.mis.ok{border-color:var(--ok-bd)}
.mis-top{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:9px}
.dots{display:flex; gap:4px}
.dot{width:20px; height:5px; border-radius:3px; background:var(--bg-muted)}
.dot.done{background:var(--ok-fg)} .dot.cur{background:var(--accent)}
.clock{margin-left:auto; display:inline-flex; align-items:center; gap:6px; font:500 12px Geist,sans-serif; color:var(--fg-secondary); background:var(--bg-subtle); border:1px solid var(--border-soft); border-radius:999px; padding:4px 11px}
.mis h2{font-size:18px; line-height:1.25}
.story{color:var(--fg-secondary); margin-top:6px; line-height:1.6; max-width:78ch}
.narr{margin-top:9px; padding:9px 12px; border-left:3px solid var(--accent); background:var(--info-bg); color:var(--info-fg); border-radius:0 9px 9px 0; font-size:13px; line-height:1.55}
.objs-h{margin-top:14px}
.objs{list-style:none; margin:7px 0 0; padding:0; display:grid; gap:6px}
.obj{display:flex; gap:9px; align-items:flex-start; font-size:13.5px; line-height:1.45}
.obj .ck{width:18px; height:18px; border-radius:5px; border:1.5px solid var(--border-strong); flex:none; display:grid; place-items:center; margin-top:1px}
.obj.done .ck{background:var(--ok-fg); border-color:var(--ok-fg); color:var(--bg-canvas)}
.obj.done .tx{color:var(--fg-muted); text-decoration:line-through}
.obj.cur .tx{font-weight:600}
.obj.cur .ck{border-color:var(--accent)}
.mis-foot{display:flex; gap:10px; margin-top:13px; flex-wrap:wrap; align-items:center}
.pen{font-size:12px; color:var(--err-fg)}
.dica{margin-top:10px; padding:10px 13px; background:var(--hold-bg); color:var(--hold-fg); border:1px solid var(--hold-bd); border-radius:9px; font-size:13px; line-height:1.55}
.dica b{display:block; font-size:11px; letter-spacing:.06em; text-transform:uppercase; margin-bottom:3px}
.fecha{margin-top:13px; background:var(--ok-bg); color:var(--ok-fg); border:1px solid var(--ok-bd); border-radius:11px; padding:13px 15px}
.fecha-h{display:flex; align-items:center; gap:7px; font-weight:600; margin-bottom:5px}
.fecha-h .pts{margin-left:auto; font-size:12.5px}
.fecha p{line-height:1.6; font-size:13.5px}
.fecha-f{display:flex; align-items:center; gap:10px; margin-top:11px; flex-wrap:wrap}
.fecha-f .btn{margin-left:auto}
.ref{font-size:11.5px; font-weight:500; border:1px solid currentColor; border-radius:999px; padding:2px 9px; opacity:.85}

/* ── janela do navegador ── */
.win{border:1px solid var(--border-default); border-radius:13px; overflow:hidden; background:var(--bg-canvas); box-shadow:var(--shadow-win)}
.win-bar{display:flex; align-items:flex-end; gap:3px; padding:8px 10px 0; background:var(--bg-muted); overflow-x:auto}
.lights{display:flex; gap:6px; margin:0 8px 11px 2px}
.lights i{width:10px; height:10px; border-radius:50%; background:var(--border-strong)}
.tab{display:flex; align-items:center; gap:7px; padding:8px 14px; border-radius:9px 9px 0 0; font:500 12.5px Geist,sans-serif; color:var(--fg-muted); background:transparent; border:0; cursor:pointer; white-space:nowrap}
.tab:hover{color:var(--fg-primary)}
.tab[aria-selected="true"]{background:var(--bg-canvas); color:var(--fg-primary)}
.fav{width:16px; height:16px; border-radius:4px; display:grid; place-items:center; font:700 9.5px Geist,sans-serif; color:#fff}
.fav-k{background:var(--kms-head)} .fav-w{background:var(--wa-green)}
.win-url{display:flex; align-items:center; gap:8px; padding:7px 12px; border-bottom:1px solid var(--border-soft); background:var(--bg-canvas)}
.url{flex:1; min-width:0; display:flex; align-items:center; gap:6px; font:12px "Geist Mono",monospace; color:var(--fg-muted); background:var(--bg-subtle); border-radius:999px; padding:5px 12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.sim-tag{font:600 10px Geist,sans-serif; letter-spacing:.06em; text-transform:uppercase; color:var(--hold-fg); background:var(--hold-bg); border:1px solid var(--hold-bd); border-radius:5px; padding:2px 7px}

/* ── plataforma ── */
.kms-head{display:flex; align-items:center; gap:10px; padding:10px 14px; background:var(--kms-head); color:#fff}
.kms-logo{font:700 15px Geist,sans-serif; letter-spacing:-.01em}
.kms-tag{font-size:11.5px; opacity:.6}
.kms-user{margin-left:auto; display:flex; align-items:center; gap:10px; opacity:.95}
.av{width:28px; height:28px; border-radius:50%; display:grid; place-items:center; font:600 11px Geist,sans-serif; background:rgba(255,255,255,.16); color:#fff}
.kms-body{display:grid; grid-template-columns:176px minmax(0,1fr); min-height:560px}
.kms-nav{border-right:1px solid var(--border-soft); padding:10px 8px; display:flex; flex-direction:column; gap:2px; background:var(--bg-subtle)}
.nav-it{display:flex; align-items:center; gap:9px; padding:8px 10px; border-radius:8px; border:0; background:none; color:var(--fg-secondary); font:500 13px Geist,sans-serif; text-align:left; cursor:pointer; white-space:nowrap}
.nav-it:hover{background:var(--bg-muted)}
.nav-it[aria-current="page"]{background:var(--bg-canvas); color:var(--accent); box-shadow:var(--shadow-card)}
.nav-it.off{opacity:.55}
.nb{margin-left:auto; min-width:18px; height:18px; border-radius:9px; background:var(--err-fg); color:var(--bg-canvas); font:600 10.5px Geist,sans-serif; display:grid; place-items:center; padding:0 5px}
.kms-main{padding:16px 18px 22px; min-width:0}
.pg-h{display:flex; align-items:flex-end; justify-content:space-between; gap:10px 16px; flex-wrap:wrap; margin-bottom:14px}
.pg-h h3{font-size:17px}
.card{display:block; border:1px solid var(--border-soft); border-radius:12px; background:var(--bg-canvas); padding:14px; margin-bottom:12px; text-align:left; width:100%}
.card-h{font-weight:600; font-size:13.5px; margin-bottom:9px; display:flex; align-items:center; gap:8px}
.card.destaque{border-color:var(--info-bd); background:var(--info-bg)}
.card.okc{border-color:var(--ok-bd); background:var(--ok-bg); color:var(--ok-fg)}
.grid3{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px; margin-bottom:12px}
.grid3 .card{margin:0}
.stat{display:flex; flex-direction:column; gap:3px; cursor:default; font:inherit; color:inherit}
button.stat{cursor:pointer}
button.stat:hover{border-color:var(--border-strong)}
.big{font:600 24px "Geist Mono",monospace; line-height:1.15}
.kv{display:grid; grid-template-columns:auto 1fr; gap:3px 12px; font-size:12.5px; margin:8px 0}
.kv span{color:var(--fg-muted)}
.kv b{font-weight:500}
.ok-line{display:flex; align-items:center; gap:6px; color:var(--ok-fg); font-size:12.5px; font-weight:500}
.ok-chip{display:inline-flex; align-items:center; gap:5px; color:var(--ok-fg); background:var(--ok-bg); border:1px solid var(--ok-bd); border-radius:999px; padding:2px 9px; font-size:11.5px; font-weight:500}
.ct-top,.al-top,.rl{display:flex; gap:10px; align-items:center}
.av2{width:28px; height:28px; border-radius:50%; flex:none; display:grid; place-items:center; font:600 10.5px Geist,sans-serif; color:#fff}
.av2.lg{width:38px; height:38px; font-size:13px}
.prox{display:flex; align-items:center; gap:10px; padding:7px 0; border-top:1px solid var(--border-soft); font-size:13px}
.prox:first-of-type{border-top:0}
.prox .btn{margin-left:auto}
.chk{display:flex; align-items:center; gap:9px; padding:6px 0; font-size:13px; color:var(--fg-secondary)}
.chk i{width:16px; height:16px; border-radius:4px; border:1.5px solid var(--border-strong); flex:none}
.chk .xp{margin-left:auto; font:500 11.5px "Geist Mono",monospace; color:var(--ok-fg)}
.vazio{display:flex; align-items:center; gap:8px; padding:26px 16px; justify-content:center; text-align:center; color:var(--fg-muted); border:1px dashed var(--border-default); border-radius:12px; font-size:13px; margin-bottom:12px}
.off-pg{max-width:52ch; line-height:1.6; color:var(--fg-secondary); font-size:13.5px}

/* subabas */
.subtabs{display:flex; gap:2px; border-bottom:1px solid var(--border-soft); margin-bottom:14px; overflow-x:auto}
.subtab{border:0; background:none; padding:8px 12px; font:500 13px Geist,sans-serif; color:var(--fg-muted); border-bottom:2px solid transparent; cursor:pointer; white-space:nowrap; margin-bottom:-1px}
.subtab:hover{color:var(--fg-primary)}
.subtab[aria-selected="true"]{color:var(--accent); border-bottom-color:var(--accent)}
.count{display:inline-grid; place-items:center; min-width:18px; height:18px; padding:0 5px; border-radius:9px; background:var(--bg-muted); color:var(--fg-secondary); font:600 10.5px Geist,sans-serif; margin-left:3px}

/* lançamento */
.lanc-top{margin-bottom:12px}
.lanc-date{display:flex; align-items:center; gap:8px; flex-wrap:wrap}
.lanc-date input{width:auto}
.linha{border:1px solid var(--border-soft); border-radius:12px; margin-bottom:10px; background:var(--bg-canvas)}
.linha.st-lancar{border-color:var(--info-bd)}
.linha-h{display:flex; align-items:center; gap:9px; padding:10px 12px; flex-wrap:wrap}
.hora{font:600 12px "Geist Mono",monospace; color:var(--fg-muted); min-width:38px}
.nome{font-weight:600; font-size:13.5px}
.tag-repo{font:600 9.5px Geist,sans-serif; letter-spacing:.07em; color:var(--hold-fg); background:var(--hold-bg); border:1px solid var(--hold-bd); border-radius:4px; padding:1px 6px}
.st{margin-left:auto; font-size:11.5px; font-weight:500; border-radius:999px; padding:2px 9px; border:1px solid; white-space:nowrap}
.st-ok{color:var(--ok-fg); background:var(--ok-bg); border-color:var(--ok-bd)}
.st-hold{color:var(--hold-fg); background:var(--hold-bg); border-color:var(--hold-bd)}
.st-err{color:var(--err-fg); background:var(--err-bg); border-color:var(--err-bd)}
.st-info{color:var(--info-fg); background:var(--info-bg); border-color:var(--info-bd)}
.st-mut{color:var(--fg-muted); background:var(--bg-subtle); border-color:var(--border-soft)}
.linha-info{padding:0 12px 10px 59px; display:flex; flex-direction:column; gap:5px; font-size:12.5px; color:var(--fg-secondary)}
.linha-f{border-top:1px solid var(--border-soft); padding:13px 12px 14px; display:grid; gap:13px}
.lb{display:block; font:600 12px Geist,sans-serif; color:var(--fg-secondary); margin-bottom:6px}
.req{color:var(--err-fg)}
.seg{display:inline-flex; flex-wrap:wrap; gap:3px; padding:3px; border-radius:9px; background:var(--bg-subtle); border:1px solid var(--border-soft)}
.seg button{border:0; background:none; padding:6px 11px; border-radius:7px; font:500 12.5px Geist,sans-serif; color:var(--fg-secondary); cursor:pointer}
.seg button:hover{color:var(--fg-primary)}
.seg button[aria-checked="true"]{background:var(--bg-canvas); color:var(--fg-primary); box-shadow:0 1px 2px rgba(0,0,0,.12); font-weight:600}
:root[data-theme="dark"] .seg button[aria-checked="true"]{background:var(--bg-muted); box-shadow:inset 0 0 0 1px var(--border-strong)}
.seg button:disabled{opacity:.45; cursor:not-allowed}
select,input[type=date],textarea{font:13px Geist,sans-serif; color:var(--fg-primary); background:var(--bg-canvas); border:1px solid var(--border-default); border-radius:8px; padding:7px 9px; width:100%; min-width:0}
input[type=date]{color-scheme:light}
:root[data-theme="dark"] input[type=date]{color-scheme:dark}
textarea{min-height:66px; resize:vertical; line-height:1.45}
.lanc-date input[type=date]{width:auto; flex:none}
.row3{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px}
.row2{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px}
.lim-cheio{color:var(--err-fg)}
.info-line{display:flex; gap:7px; align-items:flex-start; color:var(--hold-fg); margin:0}
.anexo{display:flex; align-items:center; gap:8px; flex-wrap:wrap}
.file-chip{display:inline-flex; align-items:center; gap:6px; font:500 11.5px "Geist Mono",monospace; background:var(--bg-subtle); border:1px solid var(--border-soft); border-radius:6px; padding:4px 8px; color:var(--fg-secondary); max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.savebar{display:flex; justify-content:flex-end; gap:8px; margin-top:4px; flex-wrap:wrap}

/* feedback */
.fb{border-radius:10px; padding:11px 13px; font-size:13px; margin:10px 0; border:1px solid; display:flex; gap:10px; line-height:1.55; text-align:left}
.fb b{display:block; margin-bottom:2px}
.fb-err{background:var(--err-bg); color:var(--err-fg); border-color:var(--err-bd)}
.fb-ok{background:var(--ok-bg); color:var(--ok-fg); border-color:var(--ok-bd)}
.fb-info{background:var(--info-bg); color:var(--info-fg); border-color:var(--info-bd)}
.fb .ic{margin-top:2px}

/* seletor de arquivo */
.picker{border:1px solid var(--border-default); border-radius:11px; background:var(--bg-subtle); padding:10px; margin-top:9px}
.pk-h{display:flex; align-items:center; gap:8px; margin-bottom:9px; flex-wrap:wrap}
.pk-h b{font-size:13px; margin-right:4px}
.pk-h .fechar{margin-left:auto}
.pk-tab{border:1px solid var(--border-default); background:var(--bg-canvas); border-radius:7px; padding:4px 10px; font:500 12px Geist,sans-serif; cursor:pointer; color:var(--fg-secondary)}
.pk-tab[aria-selected="true"]{border-color:var(--accent); color:var(--accent)}
.files{display:grid; grid-template-columns:repeat(auto-fill,minmax(122px,1fr)); gap:8px}
.file{border:1px solid var(--border-soft); background:var(--bg-canvas); border-radius:9px; padding:6px; cursor:pointer; text-align:left; font:inherit}
.file:hover{border-color:var(--accent)}
.thumb{height:96px; border-radius:6px; overflow:hidden; background:var(--wa-bg); padding:4px; display:flex; flex-direction:column; gap:3px}
.mini-h{font:600 7.5px Geist,sans-serif; color:var(--wa-text); background:var(--wa-head); margin:-4px -4px 1px; padding:3px 5px}
.mb{font-size:7px; line-height:1.3; padding:2px 4px; border-radius:3px; max-width:90%; color:var(--wa-text); overflow:hidden; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical}
.mb.in{background:var(--wa-in); align-self:flex-start}
.mb.out{background:var(--wa-out); align-self:flex-end}
.thumb-pdf,.thumb-pix{background:var(--bg-subtle); align-items:center; justify-content:center; color:var(--fg-muted); font:600 11px Geist,sans-serif; text-align:center}
.thumb-pix b{font-size:14px; color:#32bcad}
.fname{font:500 10.5px "Geist Mono",monospace; margin-top:5px; word-break:break-all; color:var(--fg-secondary); line-height:1.35}

/* histórico do aluno */
.al-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:10px}
.al{border:1px solid var(--border-soft); border-radius:12px; padding:12px; display:flex; flex-direction:column; gap:4px; background:var(--bg-canvas)}
.al.alvo{border-color:var(--info-bd)}
.al-top b{font-size:13.5px}
.lv{display:inline-block; font:600 10.5px Geist,sans-serif; border-radius:5px; padding:1px 7px; background:var(--info-bg); color:var(--info-fg); margin-top:2px}
.lv-sem{background:var(--err-bg); color:var(--err-fg)}
.d5-row{display:flex; align-items:center; gap:8px; font-size:12px}
.dots5{display:flex; gap:4px}
.d5{width:11px; height:11px; border-radius:50%}
.d5-p{background:#22a35a} .d5-f{background:#d9453b} .d5-r{background:#e2a02b}
.al-f{display:flex; gap:6px; flex-wrap:wrap; margin-top:6px}
.nivel-p{border-top:1px solid var(--border-soft); margin-top:8px; padding-top:10px}

/* agenda */
.wk{display:flex; align-items:center; gap:8px; font-size:12.5px}
.ag{overflow-x:auto}
.ag table{border-collapse:separate; border-spacing:3px; width:100%; min-width:470px; table-layout:fixed}
.ag th{font:600 11px Geist,sans-serif; color:var(--fg-muted); padding:4px 2px; text-align:center}
.ag th.hoje{color:var(--accent)}
.ag tbody th{width:44px; text-align:right; padding-right:6px}
.ag td{height:30px; border-radius:6px; font-size:11px; font-weight:500; padding:3px 6px; background:var(--bg-subtle); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.ag td.c-norm{background:var(--ok-bg); color:var(--ok-fg)}
.ag td.c-repo{background:var(--hold-bg); color:var(--hold-fg)}
.ag td.c-ocup{background:var(--fg-muted); color:var(--bg-canvas)}
.ag td.c-fer{background:transparent; border:1px dashed var(--border-strong); color:var(--fg-muted)}
.fer-l{font-weight:500; color:var(--hold-fg)}
.legend{display:flex; flex-wrap:wrap; gap:6px 14px; margin-top:10px; font-size:11.5px; color:var(--fg-muted)}
.legend i{width:11px; height:11px; border-radius:3px; display:inline-block; vertical-align:-1px; margin-right:5px}

/* reposições */
.repo-top{display:flex; align-items:flex-start; justify-content:space-between; gap:10px; flex-wrap:wrap; margin-bottom:12px}
.repo-top p{max-width:56ch}
.rl{padding:8px 0; border-top:1px solid var(--border-soft); font-size:13px}
.rl:first-of-type{border-top:0}
.rl > div{flex:1; min-width:0}
.rl .fim{margin-left:auto; font-size:11.5px; white-space:nowrap}

/* financeira */
.est{text-align:right}
.est b{display:block; font:600 22px "Geist Mono",monospace}
.tbl-wrap{overflow-x:auto}
table.t{width:100%; border-collapse:collapse; font-size:12.5px; min-width:500px}
table.t th{text-align:left; font:600 10.5px Geist,sans-serif; color:var(--fg-muted); text-transform:uppercase; letter-spacing:.05em; padding:7px 8px; border-bottom:1px solid var(--border-soft)}
table.t td{padding:9px 8px; border-bottom:1px solid var(--border-soft); vertical-align:top}
table.t tfoot td{border-bottom:0; font-weight:600}
table.t .r{text-align:right}
.ck-line{display:flex; gap:8px; align-items:flex-start; font-size:13px; margin:10px 0 2px; cursor:pointer}
.ck-line input{margin-top:3px; accent-color:var(--accent)}

/* WhatsApp */
.wa{display:grid; grid-template-columns:240px minmax(0,1fr); min-height:600px}
.wa-list{border-right:1px solid var(--border-soft); background:var(--bg-canvas)}
.wa-lh{padding:12px 14px; font:600 15px Geist,sans-serif; background:var(--wa-head); border-bottom:1px solid var(--border-soft)}
.wa-it{display:flex; gap:10px; padding:10px 12px; border:0; border-bottom:1px solid var(--border-soft); background:none; width:100%; text-align:left; cursor:pointer; align-items:center; font:inherit; color:inherit}
.wa-it:hover{background:var(--bg-subtle)}
.wa-it[aria-current="true"]{background:var(--bg-muted)}
.wa-av{width:38px; height:38px; border-radius:50%; flex:none; display:grid; place-items:center; font:600 13px Geist,sans-serif; color:#fff}
.wa-av.sm{width:32px; height:32px; font-size:11.5px}
.wa-tx{min-width:0; flex:1; display:flex; flex-direction:column}
.wa-r1{display:flex; gap:6px; align-items:baseline}
.wa-r1 .n{font-weight:600; font-size:13.5px; flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.wa-r1 .wt{font-size:11px; color:var(--fg-muted); flex:none}
.wa-tx .p{font-size:12px; color:var(--fg-muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.wa-chat{display:flex; flex-direction:column; background:var(--wa-bg); min-width:0}
.wa-ch{display:flex; align-items:center; gap:10px; padding:8px 12px; background:var(--wa-head); border-bottom:1px solid var(--border-soft)}
.wa-chn{display:flex; flex-direction:column; min-width:0; flex:1}
.wa-chn b{font-size:13.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.wa-chn span{font-size:11.5px; color:var(--fg-muted)}
.wa-back{display:none; border:0; background:none; cursor:pointer; padding:4px; color:var(--fg-secondary)}
.wa-msgs{flex:1; padding:12px 16px 14px; display:flex; flex-direction:column; gap:5px}
.bub{max-width:80%; padding:6px 9px 4px; border-radius:8px; font-size:13.5px; line-height:1.42; box-shadow:0 1px .5px rgba(11,20,26,.13); color:var(--wa-text); white-space:pre-wrap; word-wrap:break-word}
.bub.in{background:var(--wa-in); align-self:flex-start; border-top-left-radius:2px}
.bub.out{background:var(--wa-out); align-self:flex-end; border-top-right-radius:2px}
.bub .t{display:block; text-align:right; font-size:10.5px; color:var(--wa-meta); margin-top:1px}
.bub .who{font-weight:600; font-size:12px; color:var(--wa-name); display:block}
.daysep{align-self:center; font-size:11.5px; background:var(--wa-head); color:var(--wa-meta); padding:3px 10px; border-radius:7px; margin:8px 0 4px; box-shadow:0 1px .5px rgba(11,20,26,.1)}
.wa-comp{padding:10px 12px 12px; background:var(--wa-head); border-top:1px solid var(--border-soft)}
.wa-chat .fb{margin:8px 12px}
.comp-h{font-size:12px; font-weight:600; color:var(--fg-secondary); margin-bottom:7px}
.opts{display:grid; gap:6px}
.opt{text-align:left; border:1px solid var(--border-default); background:var(--bg-canvas); border-radius:10px; padding:9px 11px; cursor:pointer; font:13px Geist,sans-serif; color:var(--fg-primary); line-height:1.45}
.opt:hover{border-color:var(--wa-green)}
.chips{display:flex; flex-wrap:wrap; gap:6px}
.pc{display:inline-flex; align-items:center; gap:5px; border:1px solid var(--border-default); background:var(--bg-canvas); border-radius:999px; padding:5px 11px; font:500 12.5px Geist,sans-serif; cursor:pointer; color:var(--fg-secondary)}
.pc[aria-checked="true"]{background:var(--wa-green); border-color:var(--wa-green); color:#fff}
.preview{margin-top:10px; display:flex; flex-direction:column; background:var(--wa-bg); border-radius:9px; padding:10px}
.preview .bub{max-width:100%}
.comp-f{display:flex; justify-content:flex-end; margin-top:9px}
.wa-off{font-size:12px; color:var(--fg-muted); text-align:center; padding:4px}
.wa-vazio{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; color:var(--wa-meta); font-size:13px; padding:40px 16px; text-align:center}
.toast{margin:8px 12px 0; align-self:center; display:flex; gap:7px; align-items:center; background:var(--bg-canvas); color:var(--fg-secondary); border:1px solid var(--border-soft); border-radius:8px; padding:6px 11px; font-size:12px; box-shadow:var(--shadow-card)}
.toast b{font-family:"Geist Mono",monospace; font-weight:500}

@media (max-width:640px){
  .kms-body{grid-template-columns:1fr}
  .kms-nav{flex-direction:row; overflow-x:auto; border-right:0; border-bottom:1px solid var(--border-soft); padding:6px}
  .nav-it{padding:7px 10px}
  .kms-main{padding:14px 12px 18px}
  .kms-tag{display:none}
  .grid3{grid-template-columns:1fr}
  .row3,.row2{grid-template-columns:1fr}
  .wa{grid-template-columns:1fr; min-height:520px}
  .wa.has-chat .wa-list{display:none}
  .wa:not(.has-chat) .wa-chat{display:none}
  .wa-back{display:block}
  .lights{display:none}
  .mis{padding:14px}
  .intro,.rel{padding:18px 16px}
  .linha-info{padding-left:12px}
  .clock{margin-left:0}
  .bub{max-width:90%}
}
@media (prefers-reduced-motion:no-preference){
  .fb,.narr,.fecha{animation:surge .25s ease}
  @keyframes surge{from{opacity:0; transform:translateY(-3px)} to{opacity:1; transform:none}}
}

  function pickerHTML() {

    return '<div class="picker" role="dialog" aria-label="Abrir arquivo"><div class="pk-h"><b>Abrir arquivo</b>' +
      '<button class="pk-tab" data-act="pasta" data-v="img" aria-selected="' + (p === "img") + '">' + ic("img", 12) + " Imagens</button>" +
      '<button class="pk-tab" data-act="pasta" data-v="doc" aria-selected="' + (p === "doc") + '">' + ic("file", 12) + " Documentos</button>" +
      '<button class="btn btn-sm fechar" data-act="fecharPicker">Cancelar</button></div>' + lista + "</div>";
  }
  function thumb(f) {
    if (f.tipo === "pdf") return '<div class="thumb thumb-pdf">' + ic("file", 24) + "<span>PDF</span></div>";
    if (!f.chat) return '<div class="thumb thumb-pix"><b>pix</b><span>R$ 312,00</span><span>Comprovante</span></div>';
    var ms = f.preview || [];
    return '<div class="thumb"><div class="mini-h">' + esc(chatDef(f.chat).nome) + "</div>" + ms.map(function (m) {
      return '<div class="mb ' + (m.de === "eu" ? "out" : "in") + '">' + esc(m.txt) + "</div>";
    }).join("") + "</div>";

  /* ═════════ HTML: intro, missão, relatório ═════════ */
  function htmlIntro() {
    return '<section class="intro"><span class="eyebrow">Simulador · plataforma do professor</span>' +
      "<h1>Um mês de trabalho em 8 missões</h1>" +
      '<p class="sub">Uma cópia de treino da plataforma do professor e do WhatsApp, com situações reais de outubro: aluno novo, primeira aula, lançamentos, feriado, faltas, reposição e fechamento do mês. Nada daqui vai para a plataforma de verdade.</p>' +
      '<ol class="passos">' +
      '<li><span class="n">1</span><span>Leia a situação da missão e faça o que ela pede na janela logo abaixo. As abas <b>King of Languages</b> e <b>WhatsApp</b> funcionam como no dia a dia.</span></li>' +
      '<li><span class="n">2</span><span>Errou? A plataforma explica a regra e você tenta de novo. Cada missão vale 100 pontos; <b>erros e dicas descontam</b>. Depois de 2 erros, dá para ver a solução.</span></li>' +
      '<li><span class="n">3</span><span>Leva de 20 a 30 minutos. <b>O progresso não fica salvo</b>: se recarregar a página, o simulador recomeça.</span></li>' +
      "</ol>" +
      '<div class="novo">' + ic("alert", 16) + "<span><b>Novo no lançamento de aulas:</b> em toda falta sem direito a reposição, a plataforma agora pede o print da conversa entre você e o aluno. O simulador já funciona assim.</span></div>" +
      '<div class="missoes-prev">' + MISSOES.map(function (m, i) { return "<div><b>" + pad(i + 1) + "</b>" + esc(m.titulo) + "</div>"; }).join("") + "</div>" +
      '<button class="btn btn-pri" data-act="comecar" id="btn-comecar">Começar a missão 1 ' + ic("arrow", 14) + "</button></section>";
  }

  function htmlMissao() {
    var m = M(), r = S.res[S.m], o = objAtual();
    var dots = MISSOES.map(function (x, i) { return '<span class="dot ' + (i < S.m ? "done" : i === S.m ? "cur" : "") + '" title="Missão ' + (i + 1) + ": " + esc(x.titulo) + '"></span>'; }).join("");
    var objs = m.objetivos.map(function (ob) {
      var st = S.obj[ob.id] ? "done" : o && o.id === ob.id ? "cur" : "";
      return '<li class="obj ' + st + '"><span class="ck">' + (S.obj[ob.id] ? ic("check", 12) : "") + '</span><span class="tx">' + esc(ob.texto) + "</span></li>";
    }).join("");
    var narr = S.narr.map(function (n) { return '<p class="narr">' + n + "</p>"; }).join("");
    var pe;
    if (o) {
      var sol = r.erros >= 2;
      pe = '<div class="mis-foot">' + (sol
        ? '<button class="btn btn-sm" data-act="verSol" id="btn-sol" aria-expanded="' + S.verSol + '">' + ic("bulb", 14) + (S.verSol ? " Esconder solução" : " Ver solução") + "</button>"
        : '<button class="btn btn-sm" data-act="dica" id="btn-dica" aria-expanded="' + S.dica + '">' + ic("bulb", 14) + (S.dica ? " Esconder dica" : " Dica") + "</button>") +
        (r.erros ? '<span class="pen">' + r.erros + (r.erros > 1 ? " erros" : " erro") + " nesta missão</span>" : "") + "</div>";
      if (S.verSol) pe += '<div class="dica"><b>Solução</b>' + esc(o.solucao) + "</div>";
      else if (S.dica) pe += '<div class="dica"><b>Dica</b>' + esc(o.dica) + "</div>";
    } else {
      pe = '<div class="fecha" role="status"><div class="fecha-h">' + ic("check", 16) + ' Missão concluída <span class="pts num">' + r.pts + " de 100 pontos</span></div><p>" + esc(m.fechamento) + '</p><div class="fecha-f"><span class="ref">' + esc(m.ref) + '</span><button class="btn btn-pri" data-act="proxima" id="btn-proxima">' + (S.m === MISSOES.length - 1 ? "Ver resultado" : "Próxima missão") + " " + ic("arrow", 14) + "</button></div></div>";
    }
    return '<section class="mis' + (o ? "" : " ok") + '" id="missao" aria-live="polite"><div class="mis-top"><div class="dots" aria-hidden="true">' + dots + '</div><span class="eyebrow">Missão ' + (S.m + 1) + " de " + MISSOES.length + '</span><span class="clock" title="Agora, na simulação">' + ic("clock", 13) + " " + quando(S.now) + "</span></div>" +
      "<h2>" + esc(m.titulo) + '</h2><p class="story">' + esc(m.historia) + "</p>" + narr +
      '<div class="eyebrow objs-h">Objetivos</div><ul class="objs">' + objs + "</ul>" + pe + "</section>";
  }

  function htmlRelatorio() {
    var tot = 0, sem = 0;
    S.res.forEach(function (r) { tot += r.pts; if (!r.erros && !r.revelou) sem++; });
    var pct = Math.round(tot / MISSOES.length);
    var msg = pct >= 85 ? "Você está pronto(a) para a plataforma de verdade." : pct >= 60 ? "Bom caminho — revise os pontos abaixo antes da prova." : "Vale revisar os pontos abaixo e refazer o simulador antes da prova.";
    var linhas = MISSOES.map(function (m, i) {
      var r = S.res[i], est = r.pts >= 90 ? 3 : r.pts >= 60 ? 2 : 1, st = "";
      for (var k = 1; k <= 3; k++) st += '<span class="' + (k <= est ? "" : "off") + '">' + ic("star", 13) + "</span>";
      return '<tr><td><span class="num">' + pad(i + 1) + "</span> " + esc(m.titulo) + '</td><td><span class="stars" aria-label="' + est + ' de 3 estrelas">' + st + '</span></td><td class="r num">' + r.erros + '</td><td class="r num">' + r.dicas + (r.revelou ? " + solução" : "") + '</td><td class="r num"><b>' + r.pts + "</b></td></tr>";
    }).join("");
    // Até dois tropeços por missão: com muitos erros, uma lista corrida só
    // mostraria as primeiras missões e esconderia o fim do mês.
    var vistos = {}, porMissao = {}, rev = [];
    S.log.forEach(function (e) {
      if (vistos[e.texto] || (porMissao[e.m] || 0) >= 2) return;
      vistos[e.texto] = 1; porMissao[e.m] = (porMissao[e.m] || 0) + 1; rev.push(e);
    });
    var revHTML = rev.length ? '<div class="revisar"><h2>O que revisar</h2><ul>' + rev.map(function (e) {
      return "<li><b>Missão " + (e.m + 1) + " · " + esc(MISSOES[e.m].titulo) + ".</b> " + esc(e.texto) + "</li>";
    }).join("") + "</ul></div>" : '<div class="cta" style="background:var(--ok-bg);color:var(--ok-fg);border-color:var(--ok-bd)">' + ic("check", 16) + "<div>Nenhum erro nas oito missões.</div></div>";
    var reinicio = S.confirmaReinicio
      ? '<span class="pg-sub">Recomeçar apaga este resultado.</span><button class="btn" data-act="cancelaReinicio">Cancelar</button><button class="btn btn-pri" data-act="reiniciar" id="btn-reiniciar">Sim, recomeçar</button>'
      : '<button class="btn" data-act="pedeReinicio" id="btn-pede">' + ic("refresh", 14) + " Refazer o simulador</button>";
    return '<section class="rel" id="missao"><span class="eyebrow">Simulador concluído</span><h1>Aproveitamento de ' + pct + "%</h1>" +
      '<p class="sub">' + msg + " " + sem + " de " + MISSOES.length + " missões sem nenhum erro.</p>" +
      '<div class="tbl-wrap" style="margin-top:14px"><table class="t"><thead><tr><th>Missão</th><th>Resultado</th><th class="r">Erros</th><th class="r">Dicas</th><th class="r">Pontos</th></tr></thead><tbody>' + linhas + "</tbody></table></div>" +
      revHTML +
      '<div class="cta">' + ic("down", 16) + "<div><b>Agora, a prova final.</b> Role a página: logo abaixo do simulador estão a revisão rápida e as questões que concluem a trilha.</div></div>" +
      '<div class="savebar" style="margin-top:14px">' + reinicio + "</div></section>";
  }

  /* ═════════ HTML: janela ═════════ */
  var NAV = [

    { id: "agenda", rot: "Agenda do Professor", ic: "cal", url: "/agenda-professor" },

    out += '<div class="card"><div class="card-h">Checklist do dia</div>' + ck.map(function (c) { return '<div class="chk"><i></i>' + c[0] + '<span class="xp">+' + c[1] + " XP</span></div>"; }).join("") + '<p class="help">Cada item vale XP no ranking. Pendência de lançamento em aberto tira XP todo dia.</p></div>';

  /* Agenda */
  function pgAgenda() {
    var seg0 = D(S.agendaSeg), dias = [0, 1, 2, 3, 4].map(function (i) { return addDias(seg0, i); });
    var hoje = ymd(S.now);
    var head = "<tr><th></th>" + dias.map(function (d) { var k = ymd(d); return '<th class="' + (k === hoje ? "hoje" : "") + '">' + DOW3[d.getDay()] + " " + dm(d) + (FERIADOS[k] ? '<br><span class="fer-l">feriado</span>' : "") + "</th>"; }).join("") + "</tr>";
    var body = SLOTS.map(function (s) {
      return '<tr><th class="num">' + hh(s) + "</th>" + dias.map(function (d) { var c = celula(ymd(d), s); return '<td class="c-' + c.t + '" title="' + esc(c.txt) + '">' + esc(c.txt) + "</td>"; }).join("") + "</tr>";
    }).join("");

      '<div class="wk"><button class="btn btn-sm" data-act="semana" data-v="-7" aria-label="Semana anterior">' + ic("back", 14) + '</button><span class="num">' + dm(dias[0]) + " – " + dm(dias[4]) + '</span><button class="btn btn-sm" data-act="semana" data-v="7" aria-label="Próxima semana">' + ic("arrow", 14) + "</button></div></div>" +
      '<div class="ag"><table><thead>' + head + "</thead><tbody>" + body + "</tbody></table></div>" +
      '<div class="legend"><span><i style="background:var(--ok-bg);border:1px solid var(--ok-bd)"></i>Aula normal</span><span><i style="background:var(--hold-bg);border:1px solid var(--hold-bd)"></i>Reposição</span><span><i style="background:var(--fg-muted)"></i>Horário ocupado</span><span><i style="border:1px dashed var(--border-strong)"></i>Feriado nacional</span><span><i style="background:var(--bg-subtle);border:1px solid var(--border-soft)"></i>Livre</span></div>';
  }
  function celula(data, hora) {
    var a = alunoNoHorario(data, hora);
    if (FERIADOS[data] && a) return { t: "fer", txt: "Feriado" };
    for (var i = 0; i < S.reposicoes.length; i++) {
      var r = S.reposicoes[i];
      if (r.agendada && r.agendada.data === data && r.agendada.hora === hora) return { t: "repo", txt: primeiro(S.alunos[r.aluno].nome) + " · reposição" };
    }
    if (a) return { t: "norm", txt: primeiro(a.nome) };
    var dow = D(data).getDay();
    if (BLOQUEIOS.some(function (b) { return b.dow === dow && b.hora === hora; })) return { t: "ocup", txt: "Ocupado" };
    return { t: "livre", txt: "" };
  }

  /* Histórico do Aluno */
  function pgHist() {
    var ids = ORDEM.filter(function (id) { return alunoAtivo(S.alunos[id], "2099-01-01"); });
    return '<div class="pg-h"><div><h3>Histórico do Aluno</h3><div class="pg-sub">' + ids.length + " alunos na sua agenda</div></div></div>" +
      '<div class="al-grid">' + ids.map(cardAluno).join("") + "</div>";
  }
  function ultimasAulas(id) {
    var a = S.alunos[id], out = [], d = dia0(S.now), lim = D("2026-09-01");
    while (d >= lim && out.length < 5) {
      var k = ymd(d);
      if (a.inicio && k < a.inicio) break;
      linhasDoDia(k).reverse().forEach(function (l) {
        if (l.aluno !== id || out.length >= 5) return;
        var st = estadoLinha(l);
        if (st === "lancado") out.push(S.lancados[l.key].tc);
        else if (st === "historico") out.push(tipoHistorico(l));
      });
      d = addDias(d, -1);
    }
    return out.reverse().map(function (tc) {
      var c = tc === "presenca" ? "d5-p" : tc === "presenca_repo" ? "d5-r" : "d5-f";
      return '<span class="d5 ' + c + '" title="' + esc(TC[tc]) + '"></span>';
    }).join("") || '<span class="pg-sub">—</span>';
  }
  function cardAluno(id) {
    var a = S.alunos[id], alvo = id === "felipe" && !a.nivel;

  function resumo() {
    return ORDEM.filter(function (id) { return alunoAtivo(S.alunos[id], "2026-10-31"); }).map(function (id) {
      var a = S.alunos[id], base = a.valor, obs = [];

      var pend = doMes.filter(function (r) { return !repoFeita(r); }), feitas = doMes.length - pend.length;
      if (pend.length) obs.push(pend.length + (pend.length > 1 ? " reposições pendentes" : " reposição pendente") + " (" + pend.map(function (r) { return dm(D(r.falta)); }).join(", ") + ")");
      if (feitas) obs.push(feitas + (feitas > 1 ? " reposições feitas: valor liberado" : " reposição feita: valor liberado"));
      var fer = 0, sem = 0;
      Object.keys(S.lancados).forEach(function (k) {
        var p = k.split("|");
        if (p[0] !== id || p[1].slice(0, 7) !== "2026-10" || S.lancados[k].tc !== "falta") return;

      return { nome: a.nome, plano: a.plano, base: base, ret: ret, final: base - ret, obs: obs.join(" · ") || "plano cheio" };
    });

    if (!ms.length) out = '<div class="daysep">Nenhuma mensagem ainda</div>';
    return '<div class="wa-ch"><button class="wa-back" data-act="chat" data-v="" aria-label="Voltar para as conversas">' + ic("back", 18) + '</button><span class="wa-av sm" style="background:' + ch.cor + '">' + (ch.grupo ? ic("crown", 14) : ini(ch.nome)) + '</span><div class="wa-chn"><b>' + esc(ch.nome) + "</b><span>" + (ch.grupo ? "Coordenação e professores" : "online") + '</span></div><button class="btn btn-sm" data-act="print" id="btn-print">' + ic("camera", 14) + " Tirar print</button></div>" +
      (S.toast ? '<div class="toast" role="status">' + ic("img", 13) + " Print salvo em Imagens: <b>" + esc(S.toast) + "</b></div>" : "") +
      '<div class="wa-msgs">' + out + "</div>" + fbHTML("wa") + '<div class="wa-comp">' + composer(c) + "</div>";
  }
  function composer(c) {
    var m = M();
    if (m && m.id === "m1" && c === "felipe" && !S.flags.apresentacao) {
      var sel = S.montagem;
      var txt = PECAS.filter(function (p) { return sel[p.id]; }).map(function (p) { return p.txt; }).join("\n\n");
      return '<div class="comp-h">Monte a mensagem de apresentação — marque o que vai nela:</div><div class="chips" role="group" aria-label="Partes da mensagem">' + PECAS.map(function (p) {
        return '<button class="pc" role="checkbox" aria-checked="' + !!sel[p.id] + '" data-act="peca" data-v="' + p.id + '" id="pc-' + p.id + '">' + (sel[p.id] ? ic("check", 12) : "") + esc(p.rot) + "</button>";
      }).join("") + "</div>" + (txt ? '<div class="preview"><div class="bub out">' + esc(txt) + "</div></div>" : "") +
        '<div class="comp-f"><button class="btn btn-wa" data-act="enviarApres" id="btn-apres">Enviar ' + ic("arrow", 14) + "</button></div>";
    }
    if (m && m.id === "m1" && c === "coord" && !S.flags.grupo) return opts("grupo");
    if (m && m.id === "m2" && c === "felipe" && !S.flags.lembrete) return opts("lembrete");
    return '<div class="wa-off">Neste treino as mensagens já vêm prontas: aqui você lê as conversas e tira prints.</div>';
  }
  function opts(g) {
    return '<div class="comp-h">Escolha a mensagem:</div><div class="opts">' + OPTS[g].map(function (o) {
      return '<button class="opt" data-act="enviarOpt" data-g="' + g + '" data-v="' + o.id + '" id="op-' + g + "-" + o.id + '">' + esc(o.txt) + "</button>";
    }).join("") + "</div>";
  }

  /* ═════════ ações ═════════ */
  var A = {};
  A.comecar = function () { iniciaMissao(0); };
  A.proxima = function () {
    if (S.m < MISSOES.length - 1) iniciaMissao(S.m + 1);
    else { S.m = MISSOES.length; S.fb = null; rolarParaTopo(); }
  };
  A.pedeReinicio = function () { S.confirmaReinicio = true; };
  A.cancelaReinicio = function () { S.confirmaReinicio = false; };
  A.reiniciar = function () { S = novoEstado(); rolarParaTopo(); };
  A.dica = function () {
    var o = objAtual(); if (!o) return;
    if (!S.dica && !S.dicaUsada[S.m + ":" + o.id]) { S.dicaUsada[S.m + ":" + o.id] = true; S.res[S.m].dicas++; }
    S.dica = !S.dica;
  };
  A.verSol = function () { S.verSol = !S.verSol; if (S.verSol) S.res[S.m].revelou = true; };
  A.tab = function (d) { S.tab = d.v; S.picker = null; };
  A.rota = function (d) { S.rota = d.v; S.tab = "king"; S.picker = null; S.repoForm = null; };
  A.irAulas = function (d) { S.rota = "aulas"; S.aba = d.v; };
  A.aba = function (d) { S.aba = d.v; S.picker = null; };
  A.hoje = function () { S.dataLanc = ymd(S.now); S.picker = null; };
  A.irPend = function (d) { S.aba = "lancamento"; S.dataLanc = d.v; };
  A.semana = function (d) { S.agendaSeg = ymd(addDias(D(S.agendaSeg), +d.v)); };
  A.chat = function (d) { S.chat = d.v || null; };

  A.aceitar = function () {
    S.contrato = "aceito";
    sucesso("home", "Contrato aceito", "O Felipe entrou na sua agenda. Agora, o contato: ele ainda não sabe quem vai ser o professor dele.");
  };
  A.recusar = function () {
    erro("home", "Por que recusar?", "Você tem os horários livres e consegue começar na data do contrato. Recusar é para quando você não consegue cumprir a data de início, os dias ou o horário — e negar o recebimento tranca a sua agenda até a coordenação destravar.");
  };

  A.print = function () {
    var c = S.chat; if (!c) return;
    var ms = mensagens(c), nome = c === "coord" ? "Coordenacao" : primeiro(chatDef(c).nome);
    var base = "Print_WhatsApp_" + nome + "_" + dm(S.now).replace("/", "-") + "_" + hh(hm(S.now)), n = base + ".png", i = 2;
    while (S.prints.some(function (p) { return p.nome === n; })) n = base + "_" + (i++) + ".png";
    S.seq++;
    S.prints.push({ id: "p" + S.seq, nome: n, tipo: "img", chat: c, msgIds: ms.map(function (x) { return x.id; }), preview: ms.slice(-3) });
    S.toast = n;
  };
  A.peca = function (d) { S.montagem[d.v] = !S.montagem[d.v]; };
  A.enviarApres = function () {
    var m = M(); if (!m || m.id !== "m1" || S.flags.apresentacao) return;
    var sel = S.montagem, pecas = PECAS.filter(function (p) { return sel[p.id]; });
    if (!pecas.length) return aviso("wa", "Mensagem vazia", "Marque o que vai na mensagem de apresentação.");
    if (sel.meet) return erro("wa", "Mensagem não enviada", "O link direto do Meet não vai na apresentação. O aluno entra pela plataforma do aluno, que abre o Meet premium na mesma sala que você. O link direto só vai se ele não aparecer nos primeiros 5 minutos de aula.");
    if (sel.nodia) return erro("wa", "Mensagem não enviada", "Aviso no dia não dá direito a reposição: a regra é avisar com pelo menos 24h de antecedência. Prometer outra coisa vira acordo — e a sua palavra passa a valer.");
    var falta = PECAS.filter(function (p) { return p.ok && !sel[p.id]; }).map(function (p) { return p.rot.toLowerCase(); });
    if (falta.length) return erro("wa", "Faltou informação", "A mensagem de apresentação tem quatro itens obrigatórios: quem é você, data e horário da 1ª aula, considerações gerais e como entrar na aula. Faltou: " + falta.join(", ") + ".");
    addMsg("felipe", "eu", pecas.map(function (p) { return p.txt; }).join("\n\n"), 1);
    addMsg("felipe", "ele", "Oi, teacher! Tudo ótimo 😄 Combinado: quarta às 19h estarei lá!", 4);
    S.flags.apresentacao = true; S.montagem = {};
    sucesso("wa", "Mensagem enviada", "Contato feito. Falta a coordenação saber.");
  };
  A.enviarOpt = function (d) {
    var m = M(); if (!m) return;
    if (d.g === "grupo") {
      if (m.id !== "m1" || S.flags.grupo) return;
      if (d.v === "vespera") return erro("wa", "Mensagem não enviada", "O contato é o quanto antes: até você se apresentar, o aluno não sabe quem é o professor. E o grupo recebe a confirmação do contato já feito, não a promessa de fazer.");
      if (!S.flags.apresentacao) return erro("wa", "Ainda não houve contato", "Você ainda não falou com o Felipe. Confirmar no grupo é avisar que o contato aconteceu — primeiro mande a apresentação para ele.");
      addMsg("coord", "eu", OPTS.grupo[0].txt, 1);
      addMsg("coord", "coord", "Obrigada, teacher! Registrado 💙", 2);
      S.flags.grupo = true;
      sucesso("wa", "Confirmação enviada", "A coordenação já sabe que o Felipe foi contatado.");
    }
    if (d.g === "lembrete") {
      if (m.id !== "m2" || S.flags.lembrete) return;
      if (d.v === "meet") return erro("wa", "Não é esse", "O link direto do Meet só vai se o aluno não aparecer nos primeiros 5 minutos. O lembrete leva à plataforma do aluno — é por ela que ele entra no Meet premium, na mesma sala que você.");
      if (d.v === "nada") return erro("wa", "O lembrete faz parte", "O lembrete 5 minutos antes é parte do processo: é por ele que o aluno entra na aula. Sem ele, a chance de desencontro na primeira aula é grande.");
      addMsg("felipe", "eu", OPTS.lembrete[1].txt, 0);
      S.flags.lembrete = true;
      sucesso("wa", "Lembrete enviado", "Hora da aula.");
    }
  };

  A.mais = function (d) { S.hist.mais = S.hist.mais === d.v ? null : d.v; };
  A.trocarNivel = function (d) {
    var a = S.alunos[d.v];
    S.hist.aberto = S.hist.aberto === d.v ? null : d.v;
    S.hist.nivel = a.nivel || ""; S.hist.modulo = a.nivel && a.modulo ? a.nivel + "-" + a.modulo.split("parte ")[1].charAt(0) : "";
  };
  A.fecharNivel = function () { S.hist.aberto = null; };
  A.salvarNivel = function () {
    var id = S.hist.aberto, slot = "hist-" + id, m = M();
    if (!S.hist.nivel || !S.hist.modulo) return aviso(slot, "Falta preencher", "Escolha o nível e o módulo do material.");
    if (id !== "felipe" || !m || m.id !== "m2") { S.hist.aberto = null; return aviso(slot, "Nada a mudar aqui", "Neste treino, a única troca de nível é a do Felipe, depois da primeira aula dele."); }
    if (!feito("lembrete")) return aviso(slot, "A aula ainda não aconteceu", "O nível sai do nivelamento feito na primeira aula. Mande o lembrete e deixe a aula acontecer primeiro.");
    if (S.hist.nivel !== "A2") return erro(slot, "Nível errado", "O nivelamento do Felipe deu A2. O nível registrado define o livro que ele vê na plataforma dele.");
    if (S.hist.modulo !== "A2-1") return erro(slot, "Módulo errado", "Aluno novo começa pela parte 1 do nível. Liberar a parte 2 ou 3 pularia aulas que ele ainda não fez.");
    var a = S.alunos.felipe;
    a.nivel = "A2"; a.modulo = "A2 - parte 1 - Aula 1 até Aula 25"; a.aula = "A2-1";
    S.hist.aberto = null;
    sucesso(slot, "Nível e material salvos", "Felipe · A2 · parte 1. O livro já aparece na plataforma do aluno.");
  };

  A.setTipo = function (d) { draftK(d.k).tipo = d.v; if (S.picker && S.picker.alvo === "print:" + d.k) S.picker = null; };
  A.setDir = function (d) { draftK(d.k).direito = d.v; };
  A.abrirPicker = function (d) { S.picker = S.picker && S.picker.alvo === d.v ? null : { alvo: d.v }; S.pasta = d.p || "img"; };
  A.pasta = function (d) { S.pasta = d.v; };
  A.fecharPicker = function () { S.picker = null; };
  A.escolherArq = function (d) {
    if (!S.picker) return;
    var alvo = S.picker.alvo;
    if (alvo === "nf") S.nfEscolhido = d.v;
    else draftK(alvo.slice(6)).print = d.v;
    S.picker = null;
  };
  A.tiraPrint = function (d) { draftK(d.k).print = null; };
  A.salvarLanc = function () {
    var ls = linhasDoDia(S.dataLanc).filter(function (l) { return estadoLinha(l) === "lancar"; });
    if (!ls.length) return;
    for (var i = 0; i < ls.length; i++) {
      var v = valida(ls[i], draftK(ls[i].key), alvoAtual(ls[i].key));
      if (v && v.req) return aviso("lanc", "Falta preencher", v.req);
      if (v && v.err) return erro("lanc", v.titulo, v.err);
    }
    ls.forEach(function (l) {
      var d = draftK(l.key), tc = tcDe(d), a = S.alunos[l.aluno], f = d.print ? arq(d.print) : null;
      S.lancados[l.key] = { tc: tc, obs: d.obs.trim(), print: tc === "falta" && f ? f.nome : null };
      if ((tc === "presenca" || tc === "presenca_repo") && d.tipoAula !== "pers_sem" && d.aula) a.aula = d.aula;
      if (tc === "fcr_aluno") a.usadas++;
      if (tc === "fcr_aluno" || tc === "fcr_prof") S.reposicoes.push({ id: "r-" + l.aluno + "-" + l.data, aluno: l.aluno, falta: l.data, motivo: tc === "fcr_prof" ? "professor" : "aluno", agendada: null });
      delete S.drafts[l.key];
    });
    S.picker = null;
    sucesso("lanc", "Lançamento salvo", ls.length + (ls.length > 1 ? " aulas processadas" : " aula processada") + " · +" + 5 * ls.length + " XP");
  };

  A.repoNovo = function () { S.repoForm = { repo: "", data: "", hora: "" }; };
  A.repoCancelar = function () { S.repoForm = null; };
  A.agendar = function () {
    var f = S.repoForm, m = M();
    if (!f.repo || !f.data || !f.hora) return aviso("repo", "Falta preencher", "Escolha a aula a ser reposta, o dia e o horário.");
    var r = null; S.reposicoes.forEach(function (x) { if (x.id === f.repo) r = x; });
    if (!m || m.id !== "m7" || feito("agendar") || !feito("lanc")) return aviso("repo", "Fora do treino", "Neste simulador, a reposição a agendar é a da Ana, na missão 7, depois de lançar a falta.");
    if (r.aluno !== "ana") return aviso("repo", "Essa é de outro aluno", "Agendar a reposição de " + primeiro(S.alunos[r.aluno].nome) + " também seria bom, mas a missão pede a da Ana (falta do professor de 15/10).");
    var lim = addDias(dia0(S.now), 7);
    if (D(f.data) > lim) return erro("repo", "Longe demais", "Reposição se agenda com até 7 dias de antecedência — hoje, o mais longe é " + DOW[lim.getDay()] + ", " + dm(lim) + ".");
    var oc = ocupante(f.data, f.hora);
    if (oc) return erro("repo", "Horário ocupado", "Esse horário já está tomado (" + oc + "). Reposição precisa de um horário livre na agenda.");
    if (ehExtensao("ana", f.data, f.hora)) return erro("repo", "Isso é extensão de horário", "Esse horário encosta na aula regular da Ana (" + hh(S.alunos.ana.hora) + "). Colar a reposição na aula dela vira uma aula de 1 hora — e reposição não pode ser feita por extensão de horário. Escolha outro horário livre.");
    r.agendada = { data: f.data, hora: f.hora };
    var dd = D(f.data);
    addMsg("ana", "eu", "Ana, reposição marcada: " + DOW[dd.getDay()] + " (" + dm(dd) + ") às " + hh(f.hora) + ". Até lá! 😊", 1);
    S.repoForm = null;
    sucesso("repo", "Reposição agendada", "Ana · " + DOW[dd.getDay()] + ", " + dm(dd) + " às " + hh(f.hora) + ". Já aparece em amarelo na sua agenda.");
  };

  A.autorizar = function () {
    var m = M();
    if (!m || m.id !== "m8") return;
    if (!S.conferi) return aviso("fin", "Confirme a conferência", "Marque que conferiu seus lançamentos e o Resumo Consolidado.");
    if (pendencias().length) return erro("fin", "Ainda há aula pendente", "A aula da Carla de 30/10 não foi lançada. Autorize só depois de lançar tudo e conferir o resumo: o valor autorizado é o que será pago. Havendo divergência, avise a coordenação antes de autorizar.");
    S.autorizado = true;
    sucesso("fin", "Pagamento autorizado", "O pagamento cai até o dia 7. Quem autoriza mais cedo recebe mais cedo.");
  };
  A.lancarNF = function () {
    if (!S.nfEscolhido) return aviso("nf", "Nenhum arquivo", "Escolha o PDF da nota fiscal primeiro.");
    var f = arq(S.nfEscolhido);
    if (f.tipo !== "pdf") return erro("nf", "Arquivo errado", "Esse arquivo é uma imagem. A nota fiscal vai em PDF — o arquivo da NFS-e que você emitiu.");
    if (f.id === "f-nf-set") return erro("nf", "Nota errada", "Essa é a nota de setembro, que já foi enviada. Agora é a de outubro.");
    S.nfLancada = true; S.picker = null;
    sucesso("nf", "Nota fiscal lançada", "NF_outubro_2026.pdf enviada para a King.");
  };

  var CHG = {
    dataLanc: function (el) { if (el.value) S.dataLanc = el.value; S.picker = null; },
    conferi: function (el) { S.conferi = el.checked; },
    campo: function (el) {
      var f = el.dataset.f, k = el.dataset.k, v = el.value;
      if (k === "h") { if (f === "hNivel") { S.hist.nivel = v; S.hist.modulo = ""; } else S.hist.modulo = v; return; }
      if (k === "repo") { S.repoForm[f] = v; if (f === "data") S.repoForm.hora = ""; return; }
      var d = draftK(k);
      if (f === "livro" || f === "nivel") { d[f] = v; d.aula = ""; } else d[f] = v;
    }
  };

  /* ═════════ render ═════════ */
  function render() {
    var a = document.activeElement, foco = a && a.id ? { id: a.id, s: a.selectionStart, e: a.selectionEnd } : null;
    var html;
    if (S.m < 0) html = htmlIntro();
    else if (S.m >= MISSOES.length) html = htmlRelatorio();
    else html = htmlMissao() + htmlJanela();
    app.innerHTML = html;
    if (foco) {
      var el = document.getElementById(foco.id);
      if (el) { el.focus({ preventScroll: true }); try { if (foco.s != null) el.setSelectionRange(foco.s, foco.e); } catch (_) {} }
    }
    avisaAltura();
  }

  app.addEventListener("click", function (e) {
    var el = e.target.closest("[data-act]");
    if (!el || el.disabled || !app.contains(el)) return;
    var fn = A[el.dataset.act]; if (!fn) return;
    S.fb = null; S.toast = null;
    fn(el.dataset, el);
    checar();
    render();
  });
  app.addEventListener("change", function (e) {
    var el = e.target, h = el.dataset && el.dataset.chg;
    if (!h || !CHG[h]) return;
    S.fb = null;
    CHG[h](el);
    checar();
    render();
  });
  app.addEventListener("input", function (e) {
    var el = e.target;
    if (el.dataset && el.dataset.inp === "obs") draftK(el.dataset.k).obs = el.value;
  });

  /* ═════════ integração com o KTM ═════════ */
  var ultimaAltura = 0;
  function avisaAltura() {
    var h = Math.ceil(document.documentElement.getBoundingClientRect().height);
    if (h === ultimaAltura) return;
    ultimaAltura = h;
    try { parent.postMessage({ tipo: "ktm-embed-altura", altura: h }, "*"); } catch (_) {}
  }
  function rolarParaTopo() {
    try { parent.postMessage({ tipo: "ktm-embed-rolar" }, "*"); } catch (_) {}
  }
  function aplicaTema(t) {
    if (t !== "dark" && t !== "light") return;
    document.documentElement.dataset.theme = t;
    avisaAltura();
  }
  var temaUrl = new URLSearchParams(location.search).get("tema");
  aplicaTema(temaUrl || (window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));
  window.addEventListener("message", function (e) {
    var d = e.data;
    if (d && d.tipo === "ktm-tema") aplicaTema(d.tema);
  });
  if (window.ResizeObserver) new ResizeObserver(avisaAltura).observe(document.documentElement);
  window.addEventListener("load", avisaAltura);

  S = novoEstado();
  render();
})();
</script>
</body>
</html>
