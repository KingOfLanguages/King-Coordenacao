<!doctype html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sua agenda · Prática</title>
<!-- Atividades do módulo "Sua agenda" (Welcome Path 2.0, Fase 1), cada uma
     por ?parte=<id>: horarios, alunos, reposicao.
     Réplica da Agenda do Professor e da tela de Reposições do KMS, com os
     textos da plataforma (os sem acento são assim no KMS, não corrigir), as
     cores da legenda e as regras: horário livre recebe aluno novo; alta
     demanda das 6h às 9h e das 17h às 23h pede confirmação ao fechar; troca de
     dia de aluno vale a partir da semana seguinte; reposição só em horário
     livre. Regras: MAPA 12 (Agenda do Professor), 1 e 15; KMS atual.
     A semana é a atual, vista de segunda. Alunos fictícios. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/welcome-path/kit/kit.css">
<style>
/* ── missão ── */
.missao{border:1px solid var(--border-soft); border-radius:11px; padding:12px 14px; margin-bottom:12px; background:var(--bg-subtle)}
.cena{font-size:13px; color:var(--fg-secondary); line-height:1.55; margin-bottom:10px}
.tarefas{list-style:none; margin:0; padding:0; display:grid; gap:9px}
.tarefas li{display:flex; gap:10px; align-items:flex-start; font-size:13px}
.tarefas .n{width:20px; height:20px; border-radius:50%; flex:none; display:grid; place-items:center; font:600 11px Geist,sans-serif; border:1.5px solid var(--border-strong); color:var(--fg-muted); margin-top:1px}
.tarefas li.ok .n{background:var(--ok-fg); border-color:var(--ok-fg); color:var(--bg-canvas)}
.tarefas li.at .n{border-color:var(--accent); color:var(--accent)}
.tarefas li.fut{opacity:.55}
.tarefas li.ok b{color:var(--fg-secondary); font-weight:500}
.tarefas .tx{flex:1; min-width:0}
.tarefas .tx > p{margin-top:3px; line-height:1.55}
.tarefas .pergunta{margin-top:10px}
.tarefas .link{margin-top:8px}
.passos{margin:6px 0 0; padding-left:18px; line-height:1.6}

/* ── telas do KMS ── */
.tela-nav{display:flex; gap:2px; padding:0 8px; background:var(--bg-subtle); border-bottom:1px solid var(--border-soft); overflow-x:auto}
.tela-nav button{border:0; background:none; padding:8px 12px; font:500 12.5px Geist,sans-serif; color:var(--fg-muted); border-bottom:2px solid transparent; cursor:pointer; white-space:nowrap}
.tela-nav button[aria-selected="true"]{color:var(--accent); border-bottom-color:var(--accent); font-weight:600}
.k-h1{font:700 16px Geist,sans-serif; margin:2px 0 10px}
.ag-top{display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin-bottom:10px}
.ag-top .dir{margin-left:auto; display:flex; gap:6px; flex-wrap:wrap}
.trava{display:inline-flex; align-items:center; gap:5px; border-radius:999px; padding:4px 11px; font:600 10.5px Geist,sans-serif; letter-spacing:.18em; text-transform:uppercase; border:1px solid var(--ok-bd); background:var(--ok-bg); color:var(--ok-fg)}
.btn-perigo{background:var(--err-fg); border-color:var(--err-fg); color:var(--bg-canvas)}
.tst{display:flex; align-items:center; gap:7px; font-size:12.5px; border-radius:8px; padding:7px 11px; margin-bottom:10px; border:1px solid}
.tst-ok{background:var(--ok-bg); color:var(--ok-fg); border-color:var(--ok-bd)}
.tst-err{background:var(--err-bg); color:var(--err-fg); border-color:var(--err-bd)}
.tst-av{background:var(--hold-bg); color:var(--hold-fg); border-color:var(--hold-bd)}
.caixa-k{border:1px solid var(--border-default); border-radius:10px; padding:12px 14px; margin-bottom:10px; background:var(--bg-canvas); box-shadow:0 8px 24px rgba(15,23,42,.10)}
.caixa-k h3{font:600 14.5px Geist,sans-serif; margin:0}
.caixa-k .d{font-size:12.5px; color:var(--fg-muted); margin-top:2px}
.caixa-k .corpo{font-size:13px; color:var(--fg-secondary); margin-top:8px}
.dlg-acoes{display:flex; justify-content:flex-end; gap:6px; margin-top:12px}
.campo{display:grid; gap:5px; margin-top:10px}
.campo .rot{font:600 10.5px Geist,sans-serif; letter-spacing:.16em; text-transform:uppercase; color:var(--fg-muted)}
.campo .rot.min{letter-spacing:0; text-transform:none; font-size:12.5px; color:var(--fg-primary); font-weight:500}
.campo .nota{font-size:12px; color:var(--fg-muted)}
.inp{font:13px Geist,sans-serif; padding:6px 9px; border-radius:7px; border:1px solid var(--border-default); background:var(--bg-canvas); color:var(--fg-primary); width:fit-content; max-width:100%}
.inp:disabled{opacity:.55}
.chip-k{display:inline-block; margin-top:10px; font-size:12px; color:var(--fg-muted); border:1px solid var(--border-soft); background:var(--bg-subtle); border-radius:7px; padding:5px 10px}
.chk{display:grid; grid-template-columns:repeat(auto-fill,minmax(118px,1fr)); gap:5px 10px; border:1px solid var(--border-soft); border-radius:8px; padding:8px 10px; font-size:12px; color:var(--fg-secondary)}
.chk label{display:flex; align-items:center; gap:6px; cursor:pointer}
.chk label.off{text-decoration:line-through; opacity:.55; cursor:default}

/* grade da agenda: cores = legenda do KMS */
.grade{overflow-x:auto; border:1px solid var(--border-default); border-radius:10px}
.grade table{width:100%; min-width:600px; border-collapse:collapse; table-layout:fixed}
.grade th{font:700 11px Geist,sans-serif; letter-spacing:.05em; background:var(--bg-muted); color:var(--fg-primary); padding:7px 4px; border:1px solid var(--border-default); text-align:center}
.grade th:first-child{width:96px; text-align:left; padding-left:8px}
.grade td{border:1px solid var(--border-default); height:29px; padding:0; position:relative; font-size:11px; vertical-align:middle}
.grade td.h{background:var(--bg-subtle); color:var(--fg-secondary); font:600 10.5px "Geist Mono",monospace; padding:0 8px; white-space:nowrap}
.grade td.sobre{outline:2px solid var(--accent); outline-offset:-2px}
.grade td[data-act]{cursor:pointer}
.cb{display:block; width:100%; height:100%; min-height:28px; border:0; background:none; cursor:pointer; font:600 11px Geist,sans-serif; color:inherit; padding:2px 6px; text-align:center; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
td:not([class*="k-"]) > .cb:hover{background:var(--bg-subtle)}
.cx{display:flex; align-items:center; gap:4px; min-height:28px; padding:2px 4px 2px 7px; font-weight:600; white-space:nowrap; overflow:hidden}
.cx .nm{overflow:hidden; text-overflow:ellipsis; flex:1; min-width:0}
.cx .nm[draggable="true"]{cursor:grab}
.mini{border:1px solid rgba(29,78,216,.7); width:21px; height:21px; flex:none; border-radius:5px; background:#3b82f6; color:#fff; display:grid; place-items:center; cursor:pointer; padding:0}
.mini:hover{filter:brightness(1.1)}
.rm{position:absolute; right:3px; top:50%; transform:translateY(-50%); width:19px; height:19px; border-radius:50%; border:1px solid #fca5a5; background:#fee2e2; color:#b91c1c; display:grid; place-items:center; cursor:pointer; padding:0; opacity:0}
td:hover > .rm, .rm:focus-visible{opacity:1}
.k-aula{background:#22C55E; color:#000} .k-repo{background:#EAB308; color:#000} .k-turma{background:#8B5CF6; color:#fff}
.k-pausa{background:#EC4899; color:#fff} .k-res{background:#EF4444; color:#fff} .k-transf{background:#F97316; color:#000}
.k-break{background:#9CA3AF; color:#000} .k-ocup{background:#4B5563; color:#fff}
.alt::before{content:""; position:absolute; left:0; top:3px; bottom:3px; width:3px; border-radius:0 3px 3px 0; background:#fbbf24; box-shadow:0 0 10px rgba(251,191,36,.7); pointer-events:none; z-index:1}
.fut{display:flex; align-items:center; gap:4px; padding:3px 4px}
.fut-b{flex:1; min-width:0; border:1px solid #d97706; border-radius:999px; background:linear-gradient(180deg,#fff4bf,#ffd45c); color:#451a03; font:600 8.5px/1.25 Geist,sans-serif; letter-spacing:.1em; text-transform:uppercase; padding:3px 6px; cursor:pointer; white-space:normal}
.fut-x{width:20px; height:20px; flex:none; border-radius:50%; border:1px solid #fca5a5; background:#fff; color:#dc2626; display:grid; place-items:center; cursor:pointer; padding:0}
tr.dlg > td{padding:10px; background:var(--bg-subtle); cursor:default}
/* no celular a grade rola de lado: a janela fica presa na parte visível */
tr.dlg .caixa-k{margin:0; position:sticky; left:10px; max-width:calc(100vw - 84px)}
.legenda{display:flex; flex-wrap:wrap; justify-content:center; align-items:center; gap:6px 14px; margin-top:10px; padding:9px 12px; border:1px solid var(--border-soft); border-radius:9px; font-size:11px; color:var(--fg-secondary)}
.legenda b{font-weight:600; color:var(--fg-muted)}
.legenda i{width:11px; height:11px; border-radius:3px; display:inline-block; vertical-align:-1px; margin-right:5px}

/* tabelas simples (faltas, reposições) */
.tk-wrap{overflow-x:auto; border:1px solid var(--border-soft); border-radius:9px}
table.tk{width:100%; border-collapse:collapse; font-size:12.5px; min-width:420px}
table.tk th{text-align:left; font:600 11px Geist,sans-serif; color:var(--fg-muted); padding:8px 10px; background:var(--bg-subtle); border-bottom:1px solid var(--border-soft)}
table.tk td{padding:9px 10px; border-top:1px solid var(--border-soft)}
.badge-k{display:inline-block; border-radius:6px; padding:2px 7px; font:600 11px Geist,sans-serif; background:var(--bg-muted); color:var(--fg-primary)}
.vazio-k{border:1px dashed var(--border-default); border-radius:9px; padding:18px; text-align:center; font-size:12.5px; color:var(--fg-muted)}
.sub-abas{display:flex; gap:2px; border-bottom:1px solid var(--border-soft); margin-bottom:12px}
.sub-abas button{border:0; background:none; padding:7px 14px; font:500 12px Geist,sans-serif; color:var(--fg-muted); border-bottom:2px solid transparent; cursor:pointer}
.sub-abas button[aria-selected="true"]{color:var(--accent); border-bottom-color:var(--accent); font-weight:600}
.fim-k{display:flex; justify-content:flex-end; margin-bottom:10px}
</style>
</head>
<body>
<main id="app" class="wrap"></main>
<script src="/welcome-path/kit/kit.js"></script>
<script>
(function () {
  "use strict";
  var K = window.Kit, esc = K.esc, ic = K.ic;

  /* ═════════ ícones que o kit não tem ═════════ */
  var SVG = {
    pencil: '<path d="M17 3a2.85 2.85 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/>',
    trash: '<path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/>',
    save: '<path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><path d="M17 21v-8H7v8M7 3v5h8"/>',
    cal: '<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',
    unlock: '<rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 9.9-1"/>'
  };
  function sv(n, t) { return '<svg class="ic" width="' + (t || 14) + '" height="' + (t || 14) + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + SVG[n] + "</svg>"; }

  /* ═════════ a semana: horários do KMS (aula de 30 min a cada 35 min) ═════════ */
  function pad(n) { return (n < 10 ? "0" : "") + n; }
  function hm(m) { return pad(Math.floor(m / 60)) + ":" + pad(m % 60); }
  var INI = [], HORA = [];
  for (var i = 0, m = 7 * 60; i < 27; i++, m += 35) { INI.push(hm(m)); HORA.push(hm(m) + " - " + hm(m + 30)); }
  function H(ini) { return INI.indexOf(ini); }
  var DIAS = ["", "SEG", "TER", "QUA", "QUI", "SEX"];
  /** Alta demanda no KMS: das 6h às 9h e das 17h às 23h. */
  function altaDemanda(h) { var hh = +INI[h].slice(0, 2); return (hh >= 6 && hh < 9) || (hh >= 17 && hh < 23); }

  var hoje = new Date(); hoje.setHours(12, 0, 0, 0);
  var SEG = new Date(hoje); SEG.setDate(hoje.getDate() - ((hoje.getDay() + 6) % 7));
  function dia(n) { var d = new Date(SEG); d.setDate(SEG.getDate() + n); return d; }
  function br(d) { return pad(d.getDate()) + "/" + pad(d.getMonth() + 1) + "/" + d.getFullYear(); }
  var SEMANA = "Semana de segunda, " + br(dia(0)).slice(0, 5) + ", a sexta, " + br(dia(4)).slice(0, 5) + ". Hoje é segunda.";

  var AL = { ana: "Ana Clara Menezes", bruno: "Bruno Tavares", edu: "Eduarda Lins", felipe: "Felipe Andrade", lucas: "Lucas Ferreira", turma: "Marina e Paulo", gabriel: "Gabriel Rocha" };
  var LEGENDA = [["aula", "Aula"], ["repo", "Reposição"], ["turma", "Turma"], ["pausa", "Pausa"], ["res", "Reservado"], ["transf", "Transferência"], ["break", "Break"], ["ocup", "Ocupado"]];
  var COR = { aula: "#22C55E", repo: "#EAB308", turma: "#8B5CF6", pausa: "#EC4899", res: "#EF4444", transf: "#F97316", "break": "#9CA3AF", ocup: "#4B5563" };
  var TIPOS = [["none", "Sem aula"], ["aula", "Aula normal"], ["turma", "Turma"], ["ocup", "Horário ocupado"], ["break", "Break personalizado"]];

  function k(d, h) { return d + "|" + h; }
  function dk(key) { return +key.split("|")[0]; }
  function hk(key) { return +key.split("|")[1]; }
  function rotK(key) { return DIAS[dk(key)] + " " + HORA[hk(key)]; }

  /* A agenda da semana de um professor fictício. */
  function base() {
    var c = {};
    function poe(al, t, lista) { lista.forEach(function (x) { c[k(x[0], H(x[1]))] = { t: t, al: al }; }); }
    [1, 2, 3, 4, 5].forEach(function (d) { ["14:00", "14:35", "15:10", "15:45"].forEach(function (x) { c[k(d, H(x))] = { t: "ocup" }; }); });
    c[k(3, H("13:25"))] = { t: "ocup" };
    poe("felipe", "aula", [[3, "07:35"], [5, "07:35"]]);
    poe("ana", "aula", [[1, "18:05"], [3, "18:05"]]);
    poe("edu", "aula", [[1, "18:40"], [4, "18:40"]]);
    poe("bruno", "aula", [[2, "19:15"], [4, "19:15"]]);
    poe("lucas", "res", [[2, "19:50"], [4, "19:50"]]);
    poe("turma", "turma", [[2, "20:25"], [4, "20:25"]]);
    poe("gabriel", "pausa", [[5, "18:05"]]);
    return {
      cel: c, pend: {}, movs: [], fut: {}, repos: [], faltasRep: [],
      painel: null, aviso: null, toast: null, faltas: false,
      aba: "agenda", repoAba: "pendentes", repoForm: null,
      dica: {}, feitas: {}
    };
  }

  /* Grade desta semana com as alterações ainda não salvas. */
  function grade(s, soSalvo) {
    var g = {};
    Object.keys(s.cel).forEach(function (x) { g[x] = s.cel[x]; });
    s.repos.forEach(function (r) { if (r.ag) g[r.ag] = { t: "repo", al: r.al }; });
    if (soSalvo) return g;
    s.movs.forEach(function (mv) { var it = g[mv.de]; delete g[mv.de]; g[mv.para] = it; });
    Object.keys(s.pend).forEach(function (x) { if (s.pend[x]) g[x] = s.pend[x]; else delete g[x]; });
    return g;
  }
  function alterada(s, key) { return key in s.pend || s.movs.some(function (mv) { return mv.de === key || mv.para === key; }); }
  function temAlteracoes(s) { return Object.keys(s.pend).length > 0 || s.movs.length > 0; }
  function muda(s, key, v) {
    var salvo = s.cel[key];
    if ((!salvo && !v) || (salvo && v && salvo.t === v.t)) delete s.pend[key]; else s.pend[key] = v;
  }
  function salvo(s, d, ini, t) { var it = s.cel[k(d, H(ini))]; return !!it && it.t === t; }

  /* ═════════ a grade ═════════ */
  function celula(s, g, key) {
    var fut = s.fut[key];
    if (fut) {
      var txt = "Ocupado a partir da proxima semana para " + AL[fut.al];
      return '<td data-solta="' + key + '"><div class="fut"><button class="fut-b" id="fut-' + key.replace("|", "-") + '" data-act="futura" data-k="' + key + '">' + esc(txt) + '</button><button class="fut-x" data-act="futura" data-k="' + key + '" title="Cancelar mudança" aria-label="Cancelar mudança">' + sv("trash", 12) + "</button></div></td>";
    }
    var it = g[key], id = "c-" + key.replace("|", "-"), alt = it && alterada(s, key) ? " alt" : "";
    var rot = DIAS[dk(key)] + " " + HORA[hk(key)];
    if (!it) return '<td data-solta="' + key + '" class="' + alt + '"><button class="cb" id="' + id + '" data-act="cel" data-k="' + key + '" aria-label="' + rot + ', livre"></button></td>';
    if (it.t === "ocup" || it.t === "break") {
      return '<td data-solta="' + key + '" class="k-' + it.t + alt + '"><button class="cb" id="' + id + '" data-act="cel" data-k="' + key + '" aria-label="' + rot + ", " + (it.t === "ocup" ? "Horário ocupado" : "Break") + '">' + (it.t === "ocup" ? "Horário ocupado" : "Break") + "</button>" +
        (it.t === "break" ? '<button class="rm" data-act="rmBreak" data-k="' + key + '" title="Remover break" aria-label="Remover break">' + sv("trash", 11) + "</button>" : "") + "</td>";
    }
    var nome = esc(AL[it.al] || ""), arrasta = it.t === "aula";
    var titulo = it.t === "res" ? ' title="Previsão de início: ' + br(dia(7)) + '"' : "";
    return '<td data-solta="' + key + '" class="k-' + it.t + alt + '" id="' + id + '" data-act="cel" data-k="' + key + '"' + titulo + '><div class="cx">' +
      '<span class="nm"' + (arrasta ? ' draggable="true" data-arr="' + key + '"' : "") + ">" + nome + "</span>" +
      (arrasta ? '<button class="mini" id="ed-' + key.replace("|", "-") + '" data-act="editar" data-k="' + key + '" title="Editar horário" aria-label="Editar horário de ' + nome + '">' + sv("pencil", 11) + "</button>" : "") +
      "</div></td>";
  }

  function caixa(titulo, desc, corpo, botoes, rotulo) {
    return '<div class="caixa-k" role="dialog" aria-label="' + esc(rotulo || titulo) + '"><h3>' + esc(titulo) + "</h3>" + (desc ? '<p class="d">' + esc(desc) + "</p>" : "") + corpo + '<div class="dlg-acoes">' + botoes + "</div></div>";
  }
  function bt(act, txt, cls, extra) { return '<button class="btn btn-sm ' + (cls || "") + '" data-act="' + act + '"' + (extra || "") + ">" + txt + "</button>"; }
  function opts(lista, v) { return lista.map(function (o) { return '<option value="' + o[0] + '"' + (String(o[0]) === String(v) ? " selected" : "") + (o[2] ? " disabled" : "") + ">" + esc(o[1]) + "</option>"; }).join(""); }

  /* Janela aberta embaixo da linha do horário clicado. */
  function painel(s, g) {
    var p = s.painel;
    if (p.tipo === "agendar") {
      var d = dk(p.k), h = hk(p.k), corpo = '<span class="chip-k">' + DIAS[d] + " -  " + HORA[h] + "</span>" +
        '<div class="campo"><span class="rot">Tipo do agendamento</span><select class="inp" id="sel-tipo" data-chg="tipo">' + opts(TIPOS, p.sel) + "</select></div>";
      if (p.sel === "break") {
        corpo += '<div class="campo"><span class="nota">Aplicar este break a um ou mais horários do mesmo dia:</span><div class="chk">' + INI.map(function (_, j) {
          var o = g[k(d, j)] || (s.fut[k(d, j)] ? { t: "fut" } : null), off = o && o.t !== "break" && j !== h;
          return '<label class="' + (off ? "off" : "") + '"><input type="checkbox" id="chk-' + j + '" data-inp="slot" value="' + j + '"' + (p.slots.indexOf(j) >= 0 ? " checked" : "") + (off ? " disabled" : "") + "> " + HORA[j] + "</label>";
        }).join("") + "</div></div>";
      }
      var aluno = p.sel === "aula" || p.sel === "turma";
      if (aluno) corpo += '<div class="campo"><span class="nota">Para trocar o dia de um aluno seu, arraste a célula dele até o novo horário ou use o lápis dentro dela.</span></div>';
      return caixa("Agendar aula", "Defina o tipo do agendamento e preencha os dados obrigatorios.", corpo,
        bt("cancelar", "Cancelar") + bt("aplicar", "Aplicar", "btn-pri", ' id="b-aplicar"' + (aluno ? " disabled" : "")));
    }
    if (p.tipo === "editar") {
      var alvoOcupado = function (j) { var x = k(p.dia, j); return x !== p.k && (g[x] || s.fut[x]); };
      var corpoE = '<div class="campo"><span class="rot min">Dia da semana</span><select class="inp" id="ed-dia" data-chg="edDia">' + opts([1, 2, 3, 4, 5].map(function (x) { return [x, DIAS[x]]; }), p.dia) + "</select></div>" +
        '<div class="campo"><span class="rot min">Horário</span><select class="inp" id="ed-h" data-chg="edH">' + opts(INI.map(function (_, j) { var o = alvoOcupado(j); return [j, HORA[j] + (o ? " (ocupado)" : ""), o]; }), p.h) + "</select></div>";

  /* ═════════ ações da tela ═════════ */
  function efetivar(s) {
    Object.keys(s.pend).forEach(function (x) { if (s.pend[x]) s.cel[x] = s.pend[x]; else delete s.cel[x]; });
    var mudouAluno = s.movs.length > 0;
    s.movs.forEach(function (mv) { s.fut[mv.para] = { al: mv.al, de: mv.de }; });
    s.pend = {}; s.movs = []; s.painel = null;

  var A = {
    cel: function (d, s) {

      s.painel = null;

    fechaAviso: function (d, s) { s.aviso = null; },
    futura: function (d, s) { s.aviso = { tipo: "delFut", k: d.k }; },

    repoAgendar: function (d, s) { s.repoForm = { dia: "", h: "", aula: "0" }; },
    repoCancelar: function (d, s) { s.repoForm = null; },

  function avalia(s, a, cfg) {
