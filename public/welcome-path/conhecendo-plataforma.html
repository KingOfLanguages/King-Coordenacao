<!doctype html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Conhecendo a plataforma · Prática</title>
<!-- Atividade do módulo "Conhecendo a plataforma" (pedido do RH em 29/09:
     entre "A King por dentro" e "Sua agenda"), por ?parte=menu.
     O menu é o de cima da plataforma do professor, conferido no código da
     plataforma em 15/10/2026: Home, Feed, Oferta de Alunos, Transferência de
     Alunos, Agenda do Professor, Histórico do Aluno, Aulas e Reposições ▾
     (Lançamento de Aulas, Reposições), Materiais, Ranking ▾ (Ranking de Ligas),
     Financeira, Histórico ▾ (Histórico de Aulas) e o menu do perfil (Perfil,
     Dados bancários, Meu Onboarding, Oferta de Alunos, Resetar senha, Sair).
     O que cada tela tem vem do vídeo "Conhecendo a plataforma" do roteiro do
     suporte e dos materiais 11 a 18 do MAPA. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/welcome-path/kit/kit.css">
<style>
/* menu de cima, como na plataforma: itens soltos e três menus que abrem */
.nav{position:relative; display:flex; flex-wrap:wrap; justify-content:center; gap:2px 4px; padding:2px 10px 10px; background:var(--kms-head); color:#dfe5f5; border-bottom:1px solid rgba(255,255,255,.08)}
.nav .dd-w{position:relative}
.nav button{display:flex; align-items:center; gap:5px; border:0; background:none; color:inherit; font:500 13px Geist,sans-serif; text-align:left; padding:6px 9px; border-radius:7px; cursor:pointer; white-space:nowrap}
.nav button:hover{background:rgba(255,255,255,.08)}
.nav button[aria-expanded="true"]{background:rgba(255,255,255,.12)}
.nav button[aria-expanded="true"] svg{transform:rotate(180deg)}
.nav button svg{opacity:.7; transition:transform .15s}
.nav button.no{background:rgba(255,157,149,.16); color:#ffc9c4}
.dd{position:absolute; left:0; top:calc(100% + 6px); z-index:3; min-width:200px; display:grid; gap:2px; padding:5px; background:var(--kms-head); border:1px solid rgba(255,255,255,.14); border-radius:10px; box-shadow:0 14px 30px -8px rgba(0,0,0,.45)}
.dd button{width:100%; padding:8px 10px}
.barra{display:flex; align-items:center; gap:9px; background:var(--kms-head); color:#fff; padding:10px 12px 6px; font:700 13px Geist,sans-serif; position:relative}
.barra .av{margin-left:auto; width:28px; height:28px; border-radius:50%; background:rgba(255,255,255,.16); display:grid; place-items:center; font:600 10px Geist,sans-serif; border:0; color:#fff; cursor:pointer}
.barra .av[aria-expanded="true"]{outline:2px solid #4f7bff}
.perfil-menu{position:absolute; right:10px; top:42px; z-index:2; width:190px; background:var(--bg-canvas); color:var(--fg-primary); border:1px solid var(--border-default); border-radius:10px; box-shadow:0 12px 28px rgba(15,23,42,.18); padding:5px; display:grid}
.perfil-menu button{border:0; background:none; text-align:left; font:500 13px Geist,sans-serif; color:inherit; padding:7px 10px; border-radius:7px; cursor:pointer}
.perfil-menu button:hover{background:var(--bg-subtle)}
.perfil-menu button.ok{background:var(--ok-bg); color:var(--ok-fg)}
.perfil-menu button.no{background:var(--err-bg); color:var(--err-fg)}
.painel{padding:16px 18px; display:grid; align-content:start; gap:12px; min-height:300px}
.tarefa{border:1px solid var(--info-bd); background:var(--info-bg); color:var(--info-fg); border-radius:11px; padding:12px 14px}
.tarefa small{display:block; font:600 10.5px Geist,sans-serif; letter-spacing:.1em; text-transform:uppercase; opacity:.8; margin-bottom:3px}
.tarefa b{font-size:14.5px; color:var(--fg-primary)}
.feitos{display:grid; gap:6px; font-size:12.5px; color:var(--fg-secondary)}
.feitos div{display:flex; gap:7px; align-items:flex-start}
.feitos b{color:var(--fg-primary); font-weight:600}
@media (max-width:620px){ .nav{justify-content:flex-start; padding:2px 8px 8px} .nav .dd-w{position:static} .dd{left:8px; right:8px} .nav button{padding:6px 8px; font-size:12.5px} }
</style>
</head>
<body>
<main id="app" class="wrap"></main>
<script src="/welcome-path/kit/kit.js"></script>
<script>
(function () {
  "use strict";
  var K = window.Kit, esc = K.esc, ic = K.ic;

  /* O que tem em cada tela: o vídeo "Conhecendo a plataforma" e o MAPA. */
  var TELAS = {
    home: ["Home", "A sua central do dia: avisos da escola, próximas aulas, checklist diário, acessos rápidos, avanço de nível dos alunos e reposições."],
    agenda: ["Agenda do Professor", "A sua semana: os alunos, as reposições, os horários livres, os ocupados e os breaks."],
    feed: ["Feed", "Todos os avisos e notícias da escola. Dá para filtrar, curtir e salvar para ler depois."],
    transferencia: ["Transferência de Alunos", "Onde você pede a transferência de um aluno seu para outro professor (busque o aluno e clique em Transferir) e acompanha o pedido."],
    historicoAluno: ["Histórico do Aluno", "Um card por aluno: nível, presença do mês, próxima e última aula e as últimas 5 aulas. Tem o Mais informações, o Trocar nível e liberar material e, no cartão do topo, o Solicitar pausa."],
    lancamento: ["Lançamento de Aulas", "Os alunos com aula no dia aparecem aqui. Lançou, a aula sai da lista; se não lançar, ela vira pendência."],
    reposicoes: ["Reposições", "As reposições pendentes e as agendadas. É aqui que você agenda uma reposição."],
    materiais: ["Materiais", "Os módulos: o Now We're Talking por nível, o MAPA e o módulo Primeira aula e nivelamento."],
    oferta: ["Oferta de Alunos", "Os alunos que a escola oferece aos professores. Aqui você aceita ou recusa."],
    ligas: ["Ranking de Ligas", "A sua Liga do mês e a sua posição no ranking."],
    financeira: ["Financeira", "O Resumo financeiro do mês, a autorização do pagamento, os dados bancários e a nota fiscal. Com pendência, os ganhos ficam escondidos."],
    historicoAulas: ["Histórico de Aulas", "As aulas de cada aluno, mês a mês, com o tipo de cada aula e quando ela aconteceu."],
    perfil: ["Perfil", "Os seus dados de cadastro."],
    banco: ["Dados bancários", "A conta em que você recebe o pagamento."],
    onboarding: ["Meu Onboarding", "O seu vídeo de apresentação e o seu perfil para os alunos. O aluno assiste assim que é vinculado à sua agenda."],
    senha: ["Resetar senha", "Troca a sua senha de acesso."],
    sair: ["Sair", "Encerra a sua sessão."]
  };
  var MENU = [
    { id: "home" }, { id: "feed" }, { id: "oferta" }, { id: "transferencia" }, { id: "agenda" }, { id: "historicoAluno" },
    { grupo: "aulas", rot: "Aulas e Reposições", sub: ["lancamento", "reposicoes"] },
    { id: "materiais" },
    { grupo: "ranking", rot: "Ranking", sub: ["ligas"] },
    { id: "financeira" },
    { grupo: "historico", rot: "Histórico", sub: ["historicoAulas"] }
  ];
  var CHEV = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>';
  var PERFIL = ["perfil", "banco", "onboarding", "oferta", "senha", "sair"];
  var TAREFAS = [
    { t: "Ver as próximas aulas e o checklist do dia.", alvo: "home" },
    { t: "Ler todos os avisos e notícias da escola e salvar um para ler depois.", alvo: "feed" },
    { t: "Fechar um horário em que você não pode dar aula.", alvo: "agenda" },
    { t: "Aceitar um aluno novo que a escola ofereceu.", alvo: "oferta" },
    { t: "Trocar o nível de um aluno e liberar o material dele.", alvo: "historicoAluno" },
    { t: "Pedir a transferência de um aluno seu para outro professor.", alvo: "transferencia" },
    { t: "Lançar a aula que você acabou de dar.", alvo: "lancamento" },
    { t: "Agendar a reposição de um aluno que faltou com direito.", alvo: "reposicoes" },
    { t: "Abrir a aula do livro e consultar o MAPA.", alvo: "materiais" },
    { t: "Conferir quanto vai receber no mês e lançar a nota fiscal.", alvo: "financeira" },
    { t: "Ver as aulas de um aluno mês a mês, com o tipo de cada aula.", alvo: "historicoAulas" },
    { t: "Ver a sua posição na Liga do mês.", alvo: "ligas" },
    { t: "Pedir uma pausa nas suas aulas.", alvo: "historicoAluno", dica: "A pausa fica no cartão do topo do Histórico do Aluno, no botão Solicitar pausa." },
    { t: "Gravar o seu vídeo de apresentação para os alunos.", alvo: "onboarding", dica: "Esse fica no menu do seu perfil, no canto de cima." }
  ];

  var menu = {
    tag: "Pratique",
    titulo: "Onde fica cada coisa",
    instrucao: "Este é o menu da plataforma do professor. Para cada tarefa, clique onde você faria isso.",
    estado: function () { return { n: 0, erro: null, perfil: false, aberto: null }; },
    progresso: function (s) { return s.n + " de " + TAREFAS.length; },
    completa: function (s) { return s.n === TAREFAS.length; },
    fecho: "Home para começar o dia, Feed para os avisos, Oferta para aceitar alunos, Transferência para passar um aluno a outro professor, Agenda para os horários, Histórico do Aluno para nível, material e pausa, Aulas e Reposições para lançar e repor, Materiais para o livro e o MAPA, Financeira para receber e o Meu Onboarding no menu do perfil.",
    corpo: function (s) {
      var atual = TAREFAS[s.n], feita = s.n === TAREFAS.length;
      function botao(id, sub) {
        return '<button class="' + (s.erro === id ? "no" : "") + '"' + (sub ? ' role="menuitem"' : "") + ' id="m-' + id + '" data-act="menu" data-v="' + id + '">' + esc(TELAS[id][0]) + "</button>";
      }
      function grupo(m) {
        var ab = s.aberto === m.grupo;
        return '<div class="dd-w"><button id="g-' + m.grupo + '" data-act="grupo" data-v="' + m.grupo + '" aria-haspopup="true" aria-expanded="' + ab + '">' + esc(m.rot) + CHEV + "</button>" +
          (ab ? '<div class="dd" role="menu">' + m.sub.map(function (id) { return botao(id, true); }).join("") + "</div>" : "") + "</div>";
      }
      var h = '<div class="tela"><div class="barra">King of Languages<button class="av" id="m-perfil" data-act="perfil" aria-expanded="' + s.perfil + '" aria-label="Menu do perfil">VC</button>';
      if (s.perfil) h += '<div class="perfil-menu" role="menu">' + PERFIL.map(function (id) {
        return '<button role="menuitem" class="' + (s.erro === id ? "no" : "") + '" id="p-' + id + '" data-act="menu" data-v="' + id + '">' + esc(TELAS[id][0]) + "</button>";
      }).join("") + "</div>";
      h += '</div><nav class="nav" aria-label="Menu da plataforma">' + MENU.map(function (m) {
        return m.grupo ? grupo(m) : botao(m.id);
      }).join("") + '</nav><div class="painel">';
      if (!feita) {
        h += '<div class="tarefa" role="status"><small>Tarefa ' + (s.n + 1) + " de " + TAREFAS.length + "</small><b>" + esc(atual.t) + "</b></div>";
        if (s.erro) h += K.fb("err", "Aqui é " + TELAS[s.erro][0] + ".", TELAS[s.erro][1] + (atual.dica && s.tentou ? " " + atual.dica : ""));
      }
      if (s.n) {
        h += '<div class="feitos">' + TAREFAS.slice(0, s.n).reverse().map(function (x) {
          return "<div>" + ic("check", 13) + "<span><b>" + esc(TELAS[x.alvo][0]) + ".</b> " + esc(TELAS[x.alvo][1]) + "</span></div>";
        }).join("") + "</div>";
      }
      return h + "</div></div>";
    },
    acoes: {
      perfil: function (d, s) { s.perfil = !s.perfil; s.aberto = null; },
      grupo: function (d, s) { s.aberto = s.aberto === d.v ? null : d.v; s.perfil = false; },
      menu: function (d, s) {
        var atual = TAREFAS[s.n];
        if (!atual) return;
        s.aberto = null;
        if (d.v === atual.alvo) { s.n++; s.erro = null; s.tentou = false; s.perfil = false; return; }
        s.erro = d.v; s.tentou = true;
      }
    }
  };

  K.iniciar({ menu: menu });
})();
</script>
</body>
</html>
